<!doctype html>

<link rel="stylesheet" href="../motion/fonts/local.css">
<style>
/* Video 4, second edit. Every effect follows Derrick's real hands: data/track.js gives both hands (palm, size, index tip) and the nose on every
   frame of the edit (MediaPipe, src/track.py + src/cut2.py); data/events.js gives each gesture of the script found in that tracking.
   - what he pulls from the top hangs from his hand while it comes down, then fills the screen and blurs the video behind;
   - what appears in his hand sits above his palm and follows it; a swipe throws the objects the way his hand goes;
   - the camera zooms: whip zoom at each block, punch on each gesture, zoom on his face when he points at the lens.
   1080 x 1920, rendered at 30 fps (src/render.sh with PAGE=montage2.html). One type family (Inter). No emoji. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{position:relative;font-family:Inter,sans-serif;color:#fff}
canvas{position:absolute;left:0;top:0}
.o{position:absolute;left:0;top:0;visibility:hidden;will-change:transform}
#sub{position:absolute;left:60px;right:160px;top:1080px;text-align:center;font:800 70px/1.08 Inter;letter-spacing:-.02em;text-shadow:0 6px 26px rgba(0,0,0,.75),0 2px 4px rgba(0,0,0,.6)}
#sub em{font-style:normal;color:#FF7A1A}
.pill{display:inline-flex;align-items:center;gap:14px;padding:16px 28px;border-radius:60px;font:800 40px Inter;white-space:nowrap;box-shadow:0 18px 44px rgba(0,0,0,.45);letter-spacing:-.01em}
.or{background:linear-gradient(135deg,#FF9A3C,#FF6B00);color:#fff}
.wh{background:#fff;color:#14171A}
.dk{background:rgba(20,24,28,.88);color:#fff;border:2px solid rgba(255,255,255,.12)}
.card{background:#fff;color:#14171A;border-radius:34px;box-shadow:0 40px 100px rgba(0,0,0,.6);overflow:hidden}
.av{width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,#FF9A3C,#FF6B00);display:grid;place-items:center;box-shadow:0 14px 34px rgba(0,0,0,.45);border:6px solid #fff}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:30px;font:800 24px Inter}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<canvas id="fx" width="1080" height="1920"></canvas>
<div id="ui"></div>
<canvas id="fx2" width="1080" height="1920"></canvas>
<div id="sub"></div>
<script src="data/montage_data.js"></script>
<script src="data/track.js"></script>
<script src="data/events.js"></script>
<script>
const W = 1080, H = 1920, EDIT_DUR = EDIT.dur, DUR = EDIT_DUR + 5, END = EDIT_DUR - .25, NF = TRACK.length;
const OR = '#FF6B00', GRN = '#159A69', BJ = ['#008751', '#FCD116', '#E8112D'];
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const bk = x => { const c = 1.9; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
const $ = id => document.getElementById(id);
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ICON = {
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',
  share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/>',
  bike: '<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/>',
  store: '<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M2 7h20"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  ring: '<circle cx="12" cy="14" r="6"/><path d="m9 4 3 4 3-4"/>',
  party: '<path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01M22 8h.01M15 2h.01M22 20h.01"/><path d="m11 13 3 3"/>',
  baby: '<path d="M9 12h.01M15 12h.01M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><circle cx="12" cy="12" r="9"/>',
};
const ic = (n, s = 24, c = 'currentColor', w = 2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const LOGO = '../video1/assets/logo-oja-carte.png', APPLE = '../video1/assets/store-app-store.png', GPLAY = '../video1/assets/store-google-play.png';

/* ---------- timeline ---------- */
const WORDS = EDIT.words, BLK = Object.fromEntries(EDIT.blocks.map(b => [b[2], b]));
const bs = b => BLK[b][0], be = b => BLK[b][1];
const E = (kind, label = null, b = null) => EVENTS.find(e => e.kind === kind && (label === null || e.label === label) && (b === null || e.blk === b));
const EB = (kind, b) => EVENTS.filter(e => e.kind === kind && e.blk === b);
const wt = (w, after = 0) => { const x = WORDS.find(r => r[1] >= after && r[0].toLowerCase().replace(/[^a-zàâçéèêëîïôûùüÿœ-]/g, '') === w); return x ? x[1] : after + .5; };
const next = e => { const i = EVENTS.indexOf(e); return EVENTS[i + 1] || null; };

/* ---------- tracking: where the hands are on this frame (screen pixels, through the camera zoom) ---------- */
const fIdx = t => Math.max(0, Math.min(NF - 1, Math.floor(Math.min(t, EDIT_DUR - .05) * 24)));
function raw(t, h) { const fi = fIdx(t); for (let d = 0; d < 10; d++) for (const s of [fi - d, fi + d]) { const r = TRACK[Math.max(0, Math.min(NF - 1, s))]; if (r && r[h * 5] !== null) return r.slice(h * 5, h * 5 + 5); } return null; }
function nose(t) { const r = TRACK[fIdx(t)]; return r && r[10] !== null ? [r[10], r[11]] : [.5, .5]; }
let CAM = { z: 1, cx: 540, cy: 900 };
const scr = (x, y) => [CAM.cx + (x * W - CAM.cx) * CAM.z, CAM.cy + (y * H - CAM.cy) * CAM.z];
function palm(t, h, def = [.5, .75]) { const r = raw(t, h ?? 0); const [x, y] = r ? [r[0], r[1]] : def; const [sx, sy] = scr(x, y); return { x: sx, y: sy, s: (r ? r[2] : .15) * W * CAM.z, ix: r ? scr(r[3], r[4])[0] : sx, iy: r ? scr(r[3], r[4])[1] : sy - 80, ok: !!r }; }
function mid(t) { const a = palm(t, 0), b = palm(t, 1); return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y), a, b }; }
function upper(t) { const a = raw(t, 0), b = raw(t, 1); if (a && b) return a[1] < b[1] ? 0 : 1; return a ? 0 : 1; }
function lower(t) { const a = raw(t, 0), b = raw(t, 1); if (a && b) return a[1] > b[1] ? 0 : 1; return a ? 0 : 1; }

/* ---------- camera: base zoom on the cuts, whip zoom at each block, punches on the gestures, zoom on the face ---------- */
const PUNCH = { point_cam: [.24, .8], clap: [.16, .55], fist: [.2, .7], push: [.22, .6], swipe: [.1, .45], open: [.07, .5], present: [.07, .5], tap: [.07, .45], count: [.05, .4], point_down: [.1, .5], heart: [.1, .8], ear: [.06, .5], thumbs: [.06, .5], arm_side: [.08, .5] };
function camera(t) {
  let k = 0, lc = 0; for (const [c, big] of EDIT.cuts) if (t >= c && big) { k++; lc = c; }
  let z = (k % 2 ? 1.07 : 1.0) * (1 + .045 * cl((t - lc) / 5)), blur = 0, cx = 540, cy = 900, face = 0;
  for (let b = 1; b <= 8; b++) { const d = t - bs(b); if (d >= 0 && d < .45) { const q = 1 - eo(d / .45); z *= 1 + .35 * q; blur = Math.max(blur, 10 * q); } }
  for (const e of EVENTS) { const P = PUNCH[e.kind]; if (!P || e.t == null) continue; const d = t - e.t; if (d < -.06 || d > P[1]) continue;
    const a = d < .1 ? eo((d + .06) / .16) : 1 - eio((d - .1) / (P[1] - .1)); z *= 1 + P[0] * a; if (e.kind === 'point_cam') face = Math.max(face, a); }
  if (face) { const n = nose(t); cx = mix(540, n[0] * W, face); cy = mix(900, n[1] * H, face); }
  // shake on claps
  let sx = 0, sy = 0; for (const e of EVENTS.filter(e => e.kind === 'clap')) { const d = t - e.t; if (d > 0 && d < .35) { const q = 1 - d / .35; sx += Math.sin(t * 95) * 16 * q; sy += Math.cos(t * 80) * 12 * q; } }
  return { z, cx: cx + sx, cy: cy + sy, blur };
}

/* ---------- overlay objects ---------- */
const OBJ = {}; let HTML = '';

const contact = (n, name, btn, col, icn) => `<div class="card" style="width:330px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative"><div style="width:110px;height:110px;border-radius:50%;background:url(assets/img/cultivateur.jpg) ${40 + n * 10}% 35%/cover;border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25)"></div><div style="font:800 30px Inter;text-align:center">${name}</div><div style="font:600 22px Inter;color:#667085">Ananas · Allada</div><span class="btn" style="background:${col};color:#fff">${ic(icn, 26, '#fff', 2.6)}${btn}</span><div id="ok${n}" style="position:absolute;right:-16px;top:-16px;width:70px;height:70px;border-radius:50%;background:${GRN};display:grid;place-items:center;visibility:hidden;box-shadow:0 8px 20px rgba(21,154,105,.5)">${ic('check', 42, '#fff', 3.4)}</div></div>`;

  ${['Grossiste de riz · Tokpa', "Grossiste d'ananas · Allada", 'Grossiste de pagnes · Cotonou'].map((r, i) => `<div id="sb2r${i}" style="display:flex;align-items:center;gap:16px;font:700 32px Inter;padding:18px 8px 4px;color:#14171A">${ic('pin', 34, OR, 2.4)}${r}</div>`).join('')}</div>`);

obj('bj', `<div class="card" style="width:640px;height:540px;background:#141A22"><canvas id="bjc" width="640" height="540"></canvas></div>`);
// name band, logo, end card
obj('name', `<span class="pill wh" style="border-radius:26px;padding:16px 30px 16px 20px;gap:16px"><span style="display:flex;flex-direction:column;width:10px;height:66px;border-radius:5px;overflow:hidden"><i style="flex:1;background:${BJ[0]}"></i><i style="flex:1;background:${BJ[1]}"></i><i style="flex:1;background:${BJ[2]}"></i></span><span><span style="display:block;font:800 42px Inter">Derrick Dodoo</span><span style="display:block;font:700 28px Inter;color:${OR};margin-top:4px">Fondateur d'OJA</span></span></span>`);
