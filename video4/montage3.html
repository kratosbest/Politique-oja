<script>
const W = 1080, H = 1920, EDIT_DUR = EDIT.dur, END = EDIT_DUR - .2, DUR = EDIT_DUR + 4, NF = Math.round(EDIT_DUR * 24);
const OR = '#FF6B00', GRN = '#159A69', BJ = ['#008751', '#FCD116', '#E8112D'];
let FX = 545, FY = 880;                         // centre of his face (takes of 8 Nov, from the masks: head from y 555 to 1110): zooms keep it in place
const FACE = { 4: [505, 985] };                  // block 4 (IMG_1102) was filmed a little further away: head from y 750, a little left
const GRADE = 'brightness(.86) contrast(1.13) saturate(.72)';
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const bk = x => { const c = 1.9; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * k;
const inout = (t, a, b, d1 = .3, d2 = .3) => Math.min(eo(lin(t, a, a + d1)), 1 - eio(lin(t, b - d2, b)));
const $ = id => document.getElementById(id);
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ICON = {

  plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
};
const ic = (n, s = 24, c = 'currentColor', w = 2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const LOGO = '../video1/assets/logo-oja-carte.png', APPLE = '../video1/assets/store-app-store.png', GPLAY = '../video1/assets/store-google-play.png';

/* ---------- timeline: every effect is placed on a word Derrick says ---------- */
const WORDS = EDIT.words, BLK = Object.fromEntries(EDIT.blocks.map(b => [b[2], b]));
const bs = b => BLK[b][0], be = b => BLK[b][1];
const norm = s => s.toLowerCase().replace(/[^a-z0-9àâçéèêëîïôûùüÿœ'-]/g, '');
function T(b, w, n = 0) { const alt = w.split('|'), L = WORDS.filter(x => x[4] === b && alt.some(a => norm(x[0]).startsWith(a))); if (!L[n]) throw new Error(`mot introuvable : bloc ${b}, « ${w} » n° ${n}`); return L[n][1]; }
function Tbefore(b, w, n = 0, must = null) {             // start of the word said just before « w » (optionally only if that word is « must »)
  const L = WORDS.filter(x => x[4] === b), I = L.map((x, i) => i).filter(i => i > 0 && norm(L[i][0]).startsWith(norm(w)) && (!must || norm(L[i - 1][0]).startsWith(must)));
  if (I[n] === undefined) throw new Error(`mot introuvable : bloc ${b}, « ${w} »`); return L[I[n] - 1][1]; }
const A = {

  b2: T(2, 'tu'), gros1: T(2, 'grossiste', 0), gros2: T(2, 'grossiste', 1), cultiv: T(2, 'cultivateur'), trouves: T(2, 'trouves'), discutes: Tbefore(2, 'discutes'),
  prends: T(3, 'prends'), tokpa: T(3, 'tokpa|tokba'), ouvre: T(3, 'ouvre'), cherche: T(3, 'cherche'), ananas: T(3, 'ananas'), voit: T(3, 'voit'), allada: T(3, 'allada|alada'),
  appelle: T(3, 'appelle'), whatsapp: T(3, 'whatsapp'), troisieme: T(3, 'troisième'), choisit: T(3, 'choisit|trouve'), avant: T(3, 'avant'), ensuite: T(3, 'ensuite'), perdre: T(3, 'perdre'),
  etToi: T(4, 'et'), pAnanas: T(4, 'ananas'), pMais: T(4, 'maïs'), pTomates: T(4, 'tomates'), pPoulets: T(4, 'poulet'), pPoissons: T(4, 'poisson'), depuis: T(4, 'depuis'), ouvre4: T(4, 'ouvre'),
  nom: T(4, 'nom'), produis: T(4, 'ce'), photos: T(4, 'tes'), numero: T(4, 'numéro'), wa4: T(4, 'whatsapp'), place: T(4, 'ogya', 1), carte4: T(4, 'carte'), meme: T(4, 'même'), gratuit: T(4, "c'est"),
  mariage: T(5, 'mariage'), fete: T(5, 'fête'), bapteme: T(5, 'baptême'), trouve5: T(5, 'trouve'),
  plusB: T(6, 'plus'), cultiv6: T(6, 'cultivateur'), acheteur: T(6, "l'acheteur"), etNos: T(6, 'et'),
  w1: T(7, 'cultivateur'), w2: T(7, 'éleveur'), w3: T(7, 'grossiste'), carte7: T(7, 'carte'), telecharge: T(7, 'télécharge'), envoie: T(7, 'et'),
  partout3: T(3, 'partout'), nord: T(3, 'nord'), tout: T(3, 'tout'), nigeria: T(8, 'nigeria'), cultiv8: T(8, 'cultivateur'),
  maintenant: T(8, 'maintenant'), beninois: T(8, 'béninois'), paris: T(8, 'paris'), bruxelles: T(8, 'bruxelles'), montreal: T(8, 'montréal'), abidjan: T(8, 'abidjan'), partout: T(8, 'partout'),
  frere: T(8, 'je', 1), personne: T(8, 'plus'), livreur: T(8, 'livreur'), maman: T(8, 'maman'), touriste: T(8, 'touriste'), etVous: Tbefore(8, 'vous,', 0, 'et'), viendra: T(8, 'personne', 1),
  alors: T(8, 'alors'), faisons: T(8, 'faisons-le'), like: T(8, 'like'), partage: T(8, 'partage'), commentaire: T(8, 'commentaire'), envoyez: T(8, 'envoyez'),
  aMaman: T(8, 'maman', 1), oncle: T(8, 'oncle'), ami: T(8, 'ami'), ensemble: T(8, 'ensemble', 1), force: T(8, 'donnez-moi'),  merci: T(8, 'merci'),
};
// sound marks for src/music3.py: [time, kind] (tick: a box is ticked, tac: a pin lands, pop: a card sticks, stamp)
const SFX = [];

/* ---------- scenes (what replaces the wall behind him) ---------- */
const UI0 = A.b2 - .15, UI1 = A.trouves - .3;                  // block 2: the page of the app
const MAP0 = A.ouvre - .1, MAP1 = A.tout - .05;                 // block 3: the OJA map

const cutBefore = x => Math.max(0, ...EDIT.cuts.map(c => c[0]).filter(c => c <= x + .02));
const VC0 = cutBefore(A.connaitre - .2), VC1 = cutBefore(A.avec);   // block 1 vertigo, from cut to cut

/* ---------- camera: a small zoom change on each cut, a whip zoom at each block, and the zooms of the script ---------- */
function camera(t) {
  let b = 1; for (const bl of EDIT.blocks) if (t >= bl[0]) b = bl[2];
  let k = 0, lc = bs(b); for (const [c] of EDIT.cuts) if (t >= c && c > bs(b) + .01) { k++; lc = c; }
  let z = (k % 2 ? 1.07 : 1.0) * (1 + .03 * cl((t - lc) / 6)), blur = 0, rec = 0;
  for (const bb of [2, 3, 5, 6, 7, 8]) { const d = t - bs(bb); if (d >= 0 && d < .42) { const q = 1 - eo(d / .42); z *= 1 + .28 * q; blur = Math.max(blur, 8 * q); } }
  // block 2 « tu le trouves »: two dry zooms, like a camcorder
  if (t >= A.trouves - .12 && t < A.discutes - .1) { z *= t < A.trouves + .3 ? 1.25 : 1.5; rec = 1; }
  // block 3 ends by diving into his face (zoom-through cut), block 4 opens from it
  { const d = lin(t, be(3) - .45, be(3)); if (d > 0 && t < be(3)) { z *= 1 + 2.2 * eio(d); blur = Math.max(blur, 18 * eio(d)); } }
  { const d = t - bs(4); if (d >= 0 && d < .5) { const q = 1 - eo(d / .5); z *= 1 + .9 * q; blur = Math.max(blur, 16 * q); } }
  // block 4 « c'est gratuit » and block 8 « on y va »: a punch
  for (const [a, p] of [[A.gratuit + .2, .1], [A.merci, .12], [A.plus, .08]]) { const d = t - a; if (d > -.05 && d < .5) z *= 1 + p * (d < .08 ? eo((d + .05) / .13) : 1 - eio((d - .08) / .42)); }
  // block 8: slow push while he starts, then « Alors, faisons-le »: two dry zooms
  z *= 1 + .14 * eio(lin(t, A.maintenant - .2, A.beninois - .3)) * (1 - lin(t, A.beninois - .3, A.beninois - .1));
  if (t >= A.alors - .05 && t < A.faisons + .85) z *= t < A.faisons - .05 ? 1.32 : 1.68;
  // block 8 « Donnez-moi la force »: shake
  let sx = 0, sy = 0; { const d = t - A.force; if (d > 0 && d < .45) { const q = 1 - d / .45; sx = Math.sin(t * 95) * 14 * q; sy = Math.cos(t * 80) * 10 * q; } }
  return { z, cx: FX + sx, cy: FY + sy, blur, rec };
}
let CAM = { z: 1, cx: FX, cy: FY };
const place = (c, T) => { c.translate(T.cx, T.cy); c.scale(T.z, T.z); c.translate(-FX, -FY); };
const scr = (x, y, T = CAM) => [T.cx + (x - FX) * T.z, T.cy + (y - FY) * T.z];
