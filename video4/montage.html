<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>OJA — Vidéo 4, du champ au marché</title>
<link rel="stylesheet" href="../motion/fonts/local.css">
<style>
/* Video 4 (video4/README.md): Derrick to camera with gestures; every effect is timed on the word he says and placed where his hands move
   (data/edit_data.json: words + motion bursts with the centroid of the movement). Frames: work/frames/fNNNN.jpg (24 fps), person masks mNNNN.png
   for the titles behind him (src/masks.py). Rendered at 30 fps, 1080 x 1920 (src/render.sh). One type family (Inter). No emoji. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{position:relative;font-family:Inter,sans-serif;color:#fff}
canvas{position:absolute;left:0;top:0}
.abs{position:absolute}
.fx{position:absolute;visibility:hidden;transform-origin:50% 50%}
#sub{position:absolute;left:60px;right:160px;top:1090px;text-align:center;font:800 70px/1.08 Inter;letter-spacing:-.02em;text-shadow:0 6px 26px rgba(0,0,0,.7),0 2px 4px rgba(0,0,0,.6)}
#sub em{font-style:normal;color:#FF7A1A}
.pill{display:inline-flex;align-items:center;gap:14px;padding:16px 28px;border-radius:60px;font:800 40px Inter;white-space:nowrap;box-shadow:0 18px 44px rgba(0,0,0,.45);letter-spacing:-.01em}
.or{background:linear-gradient(135deg,#FF9A3C,#FF6B00);color:#fff}
.wh{background:#fff;color:#14171A}
.dk{background:rgba(20,24,28,.88);color:#fff;border:2px solid rgba(255,255,255,.12)}
.card{background:#fff;color:#14171A;border-radius:28px;box-shadow:0 24px 60px rgba(0,0,0,.5);overflow:hidden}
.av{width:120px;height:120px;border-radius:50%;background:linear-gradient(135deg,#FF9A3C,#FF6B00);display:grid;place-items:center;box-shadow:0 14px 34px rgba(0,0,0,.45);border:5px solid #fff}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:30px;font:800 22px Inter}
</style></head><body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="ui"></div>
<div id="sub"></div>
<script src="data/montage_data.js"></script>
<script>
const W = 1080, H = 1920, FPS_SRC = 24, EDIT_DUR = EDIT.dur, DUR = EDIT_DUR + 5, END = EDIT_DUR - .2;
const OR = '#FF6B00', GRN = '#159A69', BJ = ['#008751', '#FCD116', '#E8112D'];
const NF = Math.round(EDIT_DUR * 24);
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lin = (t, a, b) => cl((t - a) / (b - a));
const eo = x => 1 - Math.pow(1 - x, 3);
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const bk = x => { const c = 1.9; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const $ = id => document.getElementById(id);
const st = (e, o) => { for (const k in o) e.style[k] = o[k]; };
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const ICON = {
  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',
  chat: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  heart: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7Z"/>',
  share: '<path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="m16 6-4-4-4 4"/><path d="M12 2v13"/>',
  bike: '<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><path d="M15 6a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-3 11.5V14l-3-3 4-3 2 3h2"/>',
  store: '<path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M2 7h20"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  plane: '<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
  home: '<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  ring: '<circle cx="12" cy="14" r="6"/><path d="m9 4 3 4 3-4"/>',
  party: '<path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01M22 8h.01M15 2h.01M22 20h.01M22 2l-2.24.75a2.9 2.9 0 0 0-1.96 3.12c.1.86-.57 1.63-1.45 1.63h-.38c-.86 0-1.6.6-1.76 1.44L14 10"/><path d="m11 13 3 3"/>',
  baby: '<path d="M9 12h.01M15 12h.01M10 16c.5.3 1.2.5 2 .5s1.5-.2 2-.5"/><path d="M19 6.3a9 9 0 0 1 1.8 3.9 2 2 0 0 1 0 3.6 9 9 0 0 1-17.6 0 2 2 0 0 1 0-3.6A9 9 0 0 1 12 3c2 0 3.5 1.1 3.5 2.5s-.9 2.5-2 2.5c-.8 0-1.5-.4-1.5-1"/>',
};
const ic = (n, s = 24, c = 'currentColor', w = 2.2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
const LOGO = '../video1/assets/logo-oja-carte.png', APPLE = '../video1/assets/store-app-store.png', GPLAY = '../video1/assets/store-google-play.png';

/* ---------- timeline ---------- */
const WORDS = EDIT.words, BLK = Object.fromEntries(EDIT.blocks.map(b => [b[2], b])), MOT = EDIT.motion;
const norm = s => s.toLowerCase().replace(/[^a-zà-ÿ0-9']/g, '');
function wt(b, pre, n = 0) { const ws = WORDS.filter(w => w[5] === b && norm(w[0]).startsWith(norm(pre))); const w = ws[n] ?? ws[ws.length - 1]; if (!w) { console.error('no word', b, pre); return BLK[b][0]; } return w[1]; }
const bs = b => BLK[b][0], be = b => BLK[b][1];
// where the hands are around a word: the burst of motion closest to it (centroid of the movement), else a default place
function hand(t0, b, dx = 0, dy = -260, def = [540, 1250]) {
  let best = null, bd = 9; for (const m of MOT) { if (m[3] !== b) continue; const d = Math.abs(m[0] - t0 + .2); if (m[0] > t0 - 1.1 && m[0] < t0 + .8 && d < bd) { bd = d; best = m; } }
  const [x, y] = best ? [best[4] * W, best[5] * H] : def; return [cl(x + dx, 150, 930), cl(y + dy, 1300, 1380), best ? best[0] + (best[1] - best[0]) * .6 : t0]; }

/* ---------- effect elements ---------- */
// each: id, html, t0 (in), t1 (out), x, y (centre), enter, exit, extra transform
const FX = [];
const fx = (id, html, t0, t1, x, y, enter = 'pop', exit = 'pop', rot = 0) => FX.push({ id, html, t0, t1, x, y, enter, exit, rot });
const T = {};
function build() {
  const k = (n, b, pre, i = 0) => T[n] = wt(b, pre, i);
  // B1 the chain « quelqu'un qui connaît quelqu'un »
  k('connaitre', 1, 'connaître'); k('connait1', 1, 'connaît', 0); k('connait2', 1, 'connaît', 1); k('avec', 1, 'avec'); k('plus', 1, 'plus');
  const av = (n, lab) => `<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div class="av">${ic('user', 64, '#fff', 2.2)}</div><span class="pill dk" style="font-size:22px;padding:6px 14px">${lab}</span></div>`;
  const [hx1, hy1, ht1] = hand(T.connaitre, 1), [hx2, hy2, ht2] = hand(T.connait1, 1);
  fx('ch0', av(0, "quelqu'un"), Math.min(ht1, T.connaitre + .2), T.avec + .25, hx1, hy1 - 40, 'pop', 'sweep');
  fx('ch1', av(1, 'qui connaît'), Math.min(ht2, T.connait1 + .2), T.avec + .3, hx2, hy2 - 40, 'pop', 'sweep');
  [[180, 330], [400, 260], [640, 300], [860, 360], [300, 560]].forEach(([x, y], i) => fx('ch' + (i + 2), av(i + 2, "quelqu'un"), T.connait2 + i * .22, T.avec + .32 + i * .03, x, y + 40, 'pop', 'sweep'));
  // B2 search « grossiste », the farmer card pulled from the top, in the hand, chat bubbles
  k('grossiste', 2, 'grossiste'); k('cherches', 2, 'cherches'); k('cultivateur', 2, 'cultivateur'); k('trouves', 2, 'trouves'); k('discutes', 2, 'discutes');
  fx('sb2', `<div class="pill wh" style="width:820px;height:110px;font-size:40px;gap:18px">${ic('search', 46, '#667085', 2.6)}<span id="sb2t"></span><span id="sb2c" style="width:4px;height:48px;background:${OR}"></span></div>`, T.cherches - .1, T.cultivateur - .3, 540, 380, 'drop', 'pop');
  const farmer = (w = 520) => `<div class="card" style="width:${w}px"><div style="height:${w * .52}px;background:url(assets/img/cultivateur.jpg) 50% 40%/cover"></div><div style="padding:18px 24px 22px"><div style="font:800 40px Inter">Papa Koffi</div><div style="font:600 28px Inter;color:#667085;margin-top:6px;display:flex;gap:8px;align-items:center">${ic('pin', 28, OR, 2.4)}Ananas · Allada</div></div></div>`;
  fx('fc', farmer(), T.cultivateur - .15, T.trouves - .05, 540, 520, 'drop', 'pop');
  const [hx3, hy3] = hand(T.trouves, 2, 0, -300);
  fx('fc2', farmer(300), T.trouves - .05, T.discutes + 1.4, hx3, hy3 - 60, 'pop', 'pop');
  fx('bub1', `<div class="pill wh" style="font-size:30px;border-radius:30px 30px 30px 6px">Bonjour, vous avez des ananas ?</div>`, T.discutes, be(2) - .1, 380, 430, 'pop', 'pop');
  fx('bub2', `<div class="pill or" style="font-size:30px;border-radius:30px 30px 6px 30px">Oui, venez voir.</div>`, T.discutes + .6, be(2) - .1, 700, 560, 'pop', 'pop');
  // B3 the seller, the map, three contacts, the chosen one, the route
  k('vendeuse', 3, 'vendeuse'); k('topa', 3, 'topa'); k('ouvre', 3, 'ouvre'); k('cherche3', 3, 'cherche'); k('producteurs', 3, 'producteurs'); k('alada', 3, 'alada');
  k('appelle', 3, 'appelle'); k('ecrit', 3, 'écrit'); k('discute', 3, 'discute'); k('choisit', 3, 'choisit'); k('deplacer', 3, 'déplacer'); k('ensuite', 3, 'ensuite'); k('directement', 3, 'directement');
  const [vx, vy] = hand(T.vendeuse, 3, 0, -300);
  fx('vend', `<div class="card" style="width:420px"><div style="height:220px;background:url(assets/img/vendeuse.jpg) 50% 35%/cover"></div><div style="padding:14px 20px 18px"><div style="font:800 34px Inter">Maman Rose</div><div style="font:600 26px Inter;color:#667085;margin-top:4px">Vendeuse d'ananas · Tokpa</div></div></div>`, T.vendeuse - .1, T.ouvre - .1, vx, vy - 40, 'slideL', 'pop');
  fx('map', `<div class="card" style="width:960px;height:500px;position:relative;background:#151A20"><canvas id="mapc" width="960" height="500"></canvas><div id="map_sb" class="pill wh" style="position:absolute;left:24px;top:22px;font-size:32px;padding:12px 22px;gap:12px">${ic('search', 34, '#667085', 2.6)}<span id="map_sbt"></span></div></div>`, T.ouvre - .05, be(3) - .2, 540, 560, 'unfold', 'pop');
  const contact = (n, sub, btn, col, icn) => `<div class="card" style="width:300px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative"><div style="width:96px;height:96px;border-radius:50%;background:url(assets/img/cultivateur.jpg) ${50 + n * 8}% 35%/cover;border:4px solid #fff;box-shadow:0 6px 16px rgba(0,0,0,.25)"></div><div style="font:800 28px Inter;text-align:center">${sub}</div><span class="btn" style="background:${col};color:#fff">${ic(icn, 24, '#fff', 2.6)}${btn}</span><div id="ok${n}" style="position:absolute;right:-14px;top:-14px;width:64px;height:64px;border-radius:50%;background:${GRN};display:grid;place-items:center;visibility:hidden;box-shadow:0 8px 20px rgba(21,154,105,.5)">${ic('check', 38, '#fff', 3.4)}</div></div>`;
  fx('ct0', contact(0, 'Papa Koffi', 'Appeler', OR, 'phone'), T.appelle - .05, T.choisit + .3, 200, 1350, 'pop', 'sweep');
  fx('ct1', contact(1, 'Ferme Sèna', 'WhatsApp', '#25A35A', 'chat'), T.ecrit - .05, T.choisit + .35, 540, 1350, 'pop', 'sweep');
  fx('ct2', contact(2, "Coop d'Allada", 'Discuter', '#2E6BE6', 'chat'), T.discute - .05, T.ensuite - .1, 880, 1350, 'pop', 'pop');
  // B4 products rain, the form, the pin under him, free
  k('cultivateur4', 4, 'cultivateur'); k('ananas4', 4, 'ananas'); k('mais', 4, 'maïs'); k('sorgho', 4, 'sorgho'); k('poulet', 4, 'poulet'); k('ouvre4', 4, 'ouvre');
  k('nom', 4, 'nom'); k('produis', 4, 'produis'); k('photos', 4, 'photos'); k('numero', 4, 'numéro'); k('whatsapp4', 4, 'whatsapp'); k('place4', 4, 'place'); k('village', 4, 'village'); k('gratuit', 4, 'gratuit');
  [['ananas', T.ananas4, 170], ['mais', T.mais, 410], ['sorgho', T.sorgho, 660], ['poulet', T.poulet, 900]].forEach(([n, t0, x], i) =>
    fx('pr' + i, `<img src="assets/img/${n}.png" style="height:${n === 'sorgho' ? 150 : 250}px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45))">`, t0 - .15, T.ouvre4 - .2, x, 470 + (i % 2) * 60, 'drop', 'pop', (i % 2 ? 6 : -6)));
  fx('ph4', `<div style="width:300px;border-radius:44px;background:#0B0D0F;padding:10px;box-shadow:0 40px 90px rgba(0,0,0,.6),inset 0 0 0 3px #2E343A"><div style="position:relative;border-radius:36px;overflow:hidden"><img src="assets/img/ajout.jpg" style="display:block;width:280px"><div id="ph4hl" style="position:absolute;left:12px;top:118px;width:256px;height:62px;border:4px solid ${OR};border-radius:14px;box-shadow:0 0 24px rgba(255,107,0,.7)"></div></div></div>`, T.ouvre4 - .05, T.place4 - .2, 820, 640, 'pop', 'pop');
  ['Ton nom', 'Ce que tu produis', 'Tes photos', 'Ton numéro', 'Ton WhatsApp'].forEach((n, i) =>
    fx('ck' + i, `<div class="pill wh" style="font-size:32px;padding:12px 22px"><span style="width:40px;height:40px;border-radius:50%;background:${GRN};display:grid;place-items:center">${ic('check', 26, '#fff', 3.4)}</span>${n}</div>`, [T.nom, T.produis, T.photos, T.numero, T.whatsapp4][i] - .05, T.place4 - .2, 300, 360 + i * 100, 'slideL', 'pop'));
  fx('stamp', `<div class="pill" style="border:7px solid ${GRN};color:${GRN};background:rgba(255,255,255,.95);font:900 76px Inter;letter-spacing:.1em;border-radius:24px;padding:12px 36px">GRATUIT</div>`, T.gratuit - .05, be(4) + .1, 540, 420, 'pop', 'pop', -8);
  // B5 three occasions, the breeder pulled from the top, a wholesaler
  k('mariage', 5, 'mariage'); k('fete', 5, 'fête'); k('bapteme', 5, 'baptême'); k('trouve5', 5, 'trouve'); k('grossiste5', 5, 'grossiste'); k('eleveur', 5, "l'éleveur");
  [['ring', 'Un mariage', 'mariage'], ['party', 'Une fête', 'fete'], ['baby', 'Un baptême', 'bapteme']].forEach(([icn, n, kk], i) =>
    fx('oc' + i, `<div class="pill or" style="font-size:40px">${ic(icn, 44, '#fff', 2.2)}${n}</div>`, T[kk] - .05, T.trouve5 - .1, 300, 360 + i * 120, 'pop', 'pop'));
  fx('el', `<div class="card" style="width:500px"><div style="height:250px;background:url(assets/img/eleveur.jpg) 50% 40%/cover"></div><div style="padding:16px 22px 20px"><div style="font:800 36px Inter">Éleveur de poulets</div><div style="font:600 26px Inter;color:#667085;margin-top:4px">Grossiste · Appeler · WhatsApp</div></div></div>`, T.trouve5 - .15, be(5) - .1, 540, 520, 'drop', 'pop');
  // B6 the chain swept again, field and market joined by a line
  k('plus6', 6, 'plus'); k('cultivateur6', 6, 'cultivateur'); k('acheteur', 6, "l'acheteur"); k('produits', 6, 'produits'); k('champ', 6, 'champ');
  [[260, 420], [540, 360], [820, 420]].forEach(([x, y], i) => fx('c6' + i, av(i, "quelqu'un"), T.plus6 - .05 + i * .1, T.plus6 + 1.0, x, y, 'pop', 'sweep'));
  const side = (img, top, sub) => `<div class="card" style="width:360px"><div style="height:200px;background:url(assets/img/${img}.jpg) 50% 35%/cover"></div><div style="padding:14px 18px 18px"><div style="font:800 32px Inter">${top}</div><div style="font:700 26px Inter;color:${GRN};margin-top:4px">${sub}</div></div></div>`;
  fx('sd0', side('cultivateur', 'Le champ', '+ de clients'), T.cultivateur6 - .1, be(6) - .1, 230, 1340, 'slideL', 'pop');
  fx('sd1', side('vendeuse', 'Le marché', 'Du temps gagné'), T.acheteur - .1, be(6) - .1, 850, 1340, 'slideR', 'pop');
  // B7 three chips, the app in his hand, the stores, the share arrow
  k('cult7', 7, 'cultivateur'); k('eleveur7', 7, 'éleveur'); k('grossiste7', 7, 'grossiste'); k('metstoi', 7, 'mets-toi'); k('telecharge', 7, 'télécharge'); k('envoie', 7, 'envoie');
  ['Cultivateur', 'Éleveur', 'Grossiste'].forEach((n, i) => fx('r7' + i, `<div class="pill or" style="font-size:42px">${n}</div>`, [T.cult7, T.eleveur7, T.grossiste7][i] - .05, T.telecharge - .1, 300, 360 + i * 120, 'pop', 'pop'));
  const [px7, py7] = hand(T.telecharge, 7, 0, -330);
  fx('app7', `<div style="width:230px;border-radius:36px;background:#0B0D0F;padding:8px;box-shadow:0 30px 70px rgba(0,0,0,.6),inset 0 0 0 3px #2E343A"><img src="assets/img/accueil.jpg" style="display:block;width:214px;border-radius:30px"></div>`, T.telecharge - .05, T.envoie + .2, px7, py7 - 120, 'pop', 'fly');
  fx('st7', `<div style="display:flex;gap:16px"><span class="pill wh" style="font-size:32px;padding:12px 22px"><img src="${APPLE}" style="width:46px;border-radius:10px">App Store</span><span class="pill wh" style="font-size:32px;padding:12px 22px"><img src="${GPLAY}" style="width:42px">Google Play</span></div>`, T.telecharge + .2, be(7) - .1, 540, 400, 'pop', 'pop');
  fx('sh7', `<div style="width:130px;height:130px;border-radius:50%;background:${OR};display:grid;place-items:center;box-shadow:0 20px 50px rgba(255,107,0,.5)">${ic('share', 70, '#fff', 2.4)}</div>`, T.envoie, be(7) + .1, px7, py7, 'pop', 'fly');
  // B8 the diaspora, the young brother, four people, like / share / comment, send, Benin, the strength
  k('madresse', 8, "m'adresse"); k('diaspora', 8, 'diaspora'); k('paris', 8, 'paris'); k('montreal', 8, 'montréal'); k('bruxelles', 8, 'bruxelles'); k('abidjan', 8, 'abidjan'); k('partout', 8, 'partout');
  k('frere', 8, 'frère'); k('livreur', 8, 'livreur'); k('maman', 8, 'maman'); k('touriste', 8, 'touriste'); k('vous8', 8, 'vous', 2); k('personne2', 8, 'personne', 1); k('faisons', 8, 'faisons-le');
  k('like', 8, 'like'); k('partage', 8, 'partage'); k('commentaire', 8, 'commentaire'); k('envoyez', 8, 'envoyez'); k('maman2', 8, 'maman', 1); k('oncle', 8, 'oncle'); k('ami', 8, 'ami'); k('ensemble8', 8, 'ensemble', 1); k('benin8', 8, 'bénin', 2); k('force', 8, 'force', 1); k('merci', 8, 'merci');
