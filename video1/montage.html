const MAPLINES = (() => { const r = rng(12), L = []; for (let i = 0; i < 18; i++) L.push({ h: r() < .5, p: r() * 1.2 - .1, a: r() * .35 - .17, w: r() < .25 ? 22 : 9 }); return L; })();
