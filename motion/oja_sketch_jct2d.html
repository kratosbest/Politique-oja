<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sketch OJA, Je-connais-tout 2D</title>
<!-- Sketch 3 « Monsieur Je-connais-tout » in 2D cartoon (9:16, 1080x1920). Tonton Augustin and his niece Grâce in the new
     Cotonou: the avenue, the hair salon (Tonton presents it arms wide open), the awkward silence, the map OJA, the maquis.
     Puppets built by src/puppet.py (work/sketch4_puppets.json) into assets/sketch4/; voices reused from the Google Flow
     version (assets/sketch3/dub/), timing and mouths in assets/sketch4/marks.js (src/sk4_marks.py); phone screen captured by
     src/sk_screen.js into assets/sketch4/scr/. Rendered by src/sketch_jct2d_render.sh. -->
<link rel="stylesheet" href="fonts/local.css">
<script src="assets/sketch4/marks.js"></script>
<script src="assets/sketch4/puppets.js"></script>
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b1224}
#cv{position:absolute;left:0;top:0;width:1080px;height:1920px}
#sub{position:absolute;left:46px;right:46px;top:300px;text-align:center;font:900 64px/1.08 Poppins;color:#FFD23F;text-transform:uppercase;
  -webkit-text-stroke:11px #2a1206;paint-order:stroke fill;transform:skewX(-7deg);letter-spacing:.3px;text-shadow:0 6px 0 rgba(42,18,6,.55)}
#endc{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(120% 80% at 50% 45%,rgba(12,18,40,.88),rgba(8,12,28,.97))}
#endc .k{font:800 46px Poppins;color:#FFD23F;margin-bottom:18px}
#endc h2{margin:0;font:900 80px/1.03 Poppins;color:#fff;letter-spacing:-1.5px}
#endc h2 span{color:#FF8A1F}
#endc .dl{margin-top:44px;display:inline-block;padding:20px 40px;border-radius:999px;background:#FF6B00;color:#fff;font:800 46px Poppins;box-shadow:0 14px 34px rgba(255,107,0,.35)}
#endc .qr{margin-top:32px;width:250px;height:250px;padding:20px;border-radius:30px;background:#fff}
#endc .qr img{width:100%;height:100%;display:block}
#endc p{margin:20px 0 0;font:600 30px Poppins;color:#D9DEEA}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="sub"></div>
<div id="endc"><div class="k">Ne te perds plus.</div><h2>Les lieux près de toi<br>sont sur la <span>map OJA</span></h2><div class="dl">Télécharge Oja App</div>
  <div class="qr"><img src="pubs/qr_telecharger.svg" alt=""></div><p>Play Store et App Store</p></div>
<script>
const W = 1080, H = 1920, FPS = SK4.fps, DUR = SK4.total, EV = SK4.ev, L = SK4.lines, NSCR = 161;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const lin = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const hash = n => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };

// ---------- images ----------
const IM = {}, load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IM[k] = i; r(); }; i.onerror = () => { console.error('missing ' + src); r(); }; i.src = src; });
const D4 = 'assets/sketch4/';
const files = { avenue: D4 + 'avenue.jpg', salon: D4 + 'salon.jpg', maquis: D4 + 'maquis.jpg', table: D4 + 'table.png' };
const PU = {
  tonton: { meta: PUP4.tonton, ax: 430, ay: 1264, speaker: 'tonton', blinks: [2.2, 5.1, 9.6, 13.4, 17.3, 20.6, 22.9, 26.8, 29.6, 35.2, 39.1, 41.6] },
  tontonv: { meta: PUP4.tontonv, ax: 706, ay: 1264, speaker: 'tonton', blinks: [14.1, 15.9] },
  grace: { meta: PUP4.grace, ax: 400, ay: 1264, speaker: 'grace', blinks: [1.6, 4.4, 7.3, 10.9, 14.6, 18.2, 21.7, 25.1, 28.3, 34.4, 38.6, 41.0] },
};
for (const [k, p] of Object.entries(PU)) {
  files[k] = D4 + k + '.png'; files[k + '_open'] = D4 + k + '_mouth_open.png'; files[k + '_plate'] = D4 + k + '_mouth_plate.png';
  p.meta.eyes.forEach((e, i) => files[k + '_e' + i] = D4 + k + '_eye' + i + '_closed.png');
  p.off = document.createElement('canvas'); p.off.width = p.meta.size[0]; p.off.height = p.meta.size[1];
}
for (let i = 0; i < NSCR; i++) files['s' + i] = D4 + 'scr/s' + String(i).padStart(3, '0') + '.jpg';

// ---------- timeline ----------
const LN = id => L.find(l => l.id === id);
const wt = (id, w, nth = 1, end = false) => { const l = LN(id); const xs = l.words.filter(v => v[0].replace(/[^\p{L}']/gu, '').toLowerCase().startsWith(w.toLowerCase())); const x = xs[nth - 1] || xs[0]; return l.t + (x ? x[end ? 2 : 1] : 0); };
const S = id => LN(id).t, E = id => LN(id).t + LN(id).dur;
const T_VOILA = wt('d04', 'Voilà'), T_SIL = EV.silence;
const SHOTS = [
  [0, 'av_wide'], [wt('d01', 'Le'), 'av_tonton'], [S('d02') - .1, 'av_grace'], [wt('d03', 'trois'), 'kiosk'], [E('d03') - .4, 'av_grace2'],
  [EV.salon, 'salon_wide'], [S('d05') - .12, 'salon_grace'], [S('d06') - .1, 'salon_tonton_q'],
  [T_SIL, 'sil_tonton'], [T_SIL + 1.5, 'sil_ladies'], [T_SIL + 2.7, 'sil_tonton2'],
  [S('d08') - .2, 'salon_grace2'], [EV.insert, 'phone'], [EV.back, 'salon_tonton'],
  [EV.maquis, 'maquis_wide'], [S('d11') - .12, 'maquis_grace'], [EV.end, 'end']];
const shotAt = t => { let k = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i][0]) k = i; return [SHOTS[k][1], t - SHOTS[k][0], (SHOTS[k + 1] ? SHOTS[k + 1][0] : DUR) - SHOTS[k][0]]; };

// ---------- puppets ----------
function mouthLevel(p, t) {
  for (const l of L) if (l.who === p.speaker && t >= l.t && t < l.t + l.dur) { const i = Math.floor((t - l.t) * FPS); return l.mouth[Math.min(i, l.mouth.length - 1)] || 0; }
  return 0;
}
const talking = (p, t) => L.some(l => l.who === p.speaker && t >= l.t - .05 && t < l.t + l.dur + .1);
function compose(k, t) {
  const p = PU[k], M = p.meta, c = p.off.getContext('2d');
  c.clearRect(0, 0, p.off.width, p.off.height); c.drawImage(IM[k], 0, 0);
  const lv = mouthLevel(p, t), [bx, by, bw, bh] = M.mouth_box;
  if (lv > .42) c.drawImage(IM[k + '_open'], bx, by);
  else if (lv > .12) { c.drawImage(IM[k + '_plate'], bx, by); const piv = M.mouth_center[1] - (M.mouth_center[1] - by) * .62, q = .52; c.drawImage(IM[k + '_open'], bx, piv - (piv - by) * q, bw, bh * q); }
  if (p.blinks.some(b => t >= b && t < b + .13)) M.eyes.forEach((e, i) => c.drawImage(IM[k + '_e' + i], e[0], e[1]));
  return lv;
}
function puppet(inst, t) {
  const p = PU[inst.k], lv = compose(inst.k, t), sp = talking(p, t), ph = inst.ph || 0;
  const breath = .007 * Math.sin(2 * Math.PI * t / 3.3 + ph);
  const rot = (inst.rot || 0) + (sp ? .7 : .25) * Math.sin(t * (sp ? 4.3 : 1.3) + ph) * Math.PI / 180;
  ctx.save(); ctx.translate(inst.x + (inst.dx || 0), inst.y + (inst.dy || 0) - 5 * lv); ctx.rotate(rot);
  ctx.scale(inst.s * (1 - breath * .4), inst.s * (1 + breath)); ctx.drawImage(p.off, -p.ax, -p.ay); ctx.restore();
}
function table() {                                  // the maquis table in front of them, its front and the floor below in shadow
  const s = 1.55, w = IM.table.width * s, h = IM.table.height * s, x = (W - w) / 2, y = 1500 - 250 * s;
  const g = ctx.createLinearGradient(0, 1560, 0, H); g.addColorStop(0, '#5a3418'); g.addColorStop(1, '#2a160a');
  ctx.fillStyle = g; ctx.fillRect(0, 1555, W, H - 1555);
  ctx.drawImage(IM.table, x, y, w, h);
}

// ---------- camera ----------
const BG_Y = bg => (H - IM[bg].height * W / IM[bg].width) / 2 - 10;
function scene(bg, t, z, fx, fy, insts, extra) {
  const zb = 1 + (z - 1) * .55, bfx = 540 + (fx - 540) * .55, bfy = 960 + (fy - 960) * .55;
  ctx.save(); ctx.translate(540, 960); ctx.scale(zb, zb); ctx.translate(-bfx, -bfy);
  ctx.drawImage(IM[bg], 0, BG_Y(bg), W, IM[bg].height * W / IM[bg].width); ctx.restore();
  ctx.save(); ctx.translate(540, 960); ctx.scale(z, z); ctx.translate(-fx, -fy);
  insts.forEach(i => puppet(i, t)); if (extra) extra(); ctx.restore();
  vignette(.38);
}
function vignette(a) { const g = ctx.createRadialGradient(540, 900, 420, 540, 960, 1250); g.addColorStop(0, 'rgba(20,10,5,0)'); g.addColorStop(1, `rgba(20,10,5,${a})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
const B = 1985;
const TON = (o = {}) => ({ k: 'tonton', x: 330, y: B, s: 1, ...o }), GRA = (o = {}) => ({ k: 'grace', x: 770, y: B, s: 1, ph: 1.7, ...o });
const hop = (t, t0, h = 40, d = .3) => t > t0 && t < t0 + d ? -h * Math.sin(Math.PI * (t - t0) / d) : 0;

// ---------- the phone ----------
let BLUR = null;
function blurred() {
  if (BLUR) return BLUR; BLUR = document.createElement('canvas'); BLUR.width = W; BLUR.height = H; const b = BLUR.getContext('2d');
  b.filter = 'blur(16px) brightness(.62)'; const s = W / IM.salon.width * 1.5;
  b.drawImage(IM.salon, (W - IM.salon.width * s) / 2, (H - IM.salon.height * s) / 2 - 120, IM.salon.width * s, IM.salon.height * s); return BLUR;
}
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function phone(u) {
  ctx.drawImage(blurred(), 0, 0);
  const k = eo(lin(u, 0, .3)), bounce = back(lin(u, 0, .36));
  const SW = 560, SH = SW * 1688 / 780, PW = SW + 40, PH = SH + 40;
  ctx.save(); ctx.translate(540, 1150 + (1 - k) * 260); ctx.rotate((-3 + 1.0 * Math.sin(u * 1.1)) * Math.PI / 180); ctx.scale(.92 + .08 * bounce, .92 + .08 * bounce);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 24;
  rrect(ctx, -PW / 2, -PH / 2, PW, PH, 70); ctx.fillStyle = '#1c1e26'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 9; ctx.strokeStyle = '#2a140a'; ctx.stroke();
  ctx.save(); rrect(ctx, -SW / 2, -SH / 2, SW, SH, 50); ctx.clip();
  let fr = Math.min(30, (u - .15) * 30); if (u > .95) fr = 133 + (u - .95) * 30;
  const img = IM['s' + Math.max(0, Math.min(NSCR - 1, Math.round(fr)))]; if (img) ctx.drawImage(img, -SW / 2, -SH / 2, SW, SH);
  const q = lin(u, 1.85, 2.35);
  if (q > 0 && q < 1) { const sc = SW / 780, rx = -SW / 2 + 146 * sc, ry = -SH / 2 + 1420 * sc;
    ctx.beginPath(); ctx.arc(rx, ry, 30 + 60 * eo(q), 0, 2 * Math.PI); ctx.strokeStyle = `rgba(255,107,0,${.9 * (1 - q)})`; ctx.lineWidth = 10; ctx.stroke();
    ctx.beginPath(); ctx.arc(rx, ry, 30 * (1 - .3 * q), 0, 2 * Math.PI); ctx.fillStyle = `rgba(255,255,255,${.55 * (1 - q)})`; ctx.fill(); }
  ctx.restore(); ctx.restore(); vignette(.4);
}

// ---------- subtitles ----------
const SUBS = [];
L.forEach(l => {
  const ws = []; l.words.forEach(w => { if (/^[!?.,…]+$/.test(w[0]) && ws.length) { ws[ws.length - 1][0] += (w[0] === ',' || w[0] === '.' ? '' : ' ') + w[0]; ws[ws.length - 1][2] = w[2]; } else ws.push([...w]); });
  const len = g => g.map(w => w[0]).join(' ').length;
  let parts = [], cur = [];
  ws.forEach((w, i) => { cur.push(w); if (i < ws.length - 1 && (/[.!?…]$/.test(w[0]) || (/,$/.test(w[0]) && len(cur) > 22))) { parts.push(cur); cur = []; } });
  if (cur.length) parts.push(cur);
  for (let changed = true; changed;) { changed = false;
    for (let i = 0; i < parts.length; i++) { if (len(parts[i]) > 12) continue;
      const j = i + 1 < parts.length && (i === 0 || len(parts[i + 1]) <= len(parts[i - 1])) ? i + 1 : i - 1;
      if (j >= 0 && j < parts.length && len(parts[i]) + len(parts[j]) + 1 <= 46) { const a = Math.min(i, j); parts.splice(a, 2, parts[a].concat(parts[a + 1])); changed = true; break; } } }
  parts.forEach(g => SUBS.push({ t0: l.t + g[0][1], text: g.map(w => w[0]).join(' '), line: l }));
});
SUBS.forEach((s, i) => { const nx = SUBS[i + 1]; s.t1 = nx && nx.line === s.line ? nx.t0 : Math.min(s.line.t + s.line.dur + .25, nx ? nx.t0 : 1e9); });

// ---------- one frame ----------
function drawAt(t) {
  const [shot, u, len] = shotAt(t), push = u / Math.max(len, .5);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const voila = t >= T_VOILA - .05 && t < S('d05') - .12;           // Tonton presents the salon, arms wide open
  const tonS = () => voila ? { k: 'tontonv', x: 330, y: B, s: 1, dy: hop(t, T_VOILA - .05, 36, .32) } : TON();
  if (shot === 'av_wide') scene('avenue', t, 1.0 + .035 * push, 540, 960, [TON(), GRA()]);
  else if (shot === 'av_tonton') scene('avenue', t, 1.42 + .05 * push, 385, 1110, [TON(), GRA()]);
  else if (shot === 'av_grace' || shot === 'av_grace2') scene('avenue', t, 1.42 + .05 * push, 745, 1085, [TON(), GRA({ rot: (shot === 'av_grace2' ? 1.5 : 0) * Math.PI / 180 })]);
  else if (shot === 'kiosk') scene('avenue', t, 1.75 + .08 * push, 600, 760, [TON(), GRA()]);
  else if (shot === 'salon_wide') scene('salon', t, 1.0 + .04 * push, 560, 975, [tonS(), GRA()]);
  else if (shot === 'salon_grace' || shot === 'salon_grace2') scene('salon', t, 1.45 + .05 * push, 745, 1085, [TON(), GRA()]);
  else if (shot === 'salon_tonton_q') scene('salon', t, 1.5 + .25 * eo(lin(u, 0, .2)), 385, 1100, [TON({ dy: hop(t, S('d06'), 30, .28) }), GRA()]);
  else if (shot === 'sil_tonton' || shot === 'sil_tonton2') scene('salon', t, 1.6 + .08 * push, 385, 1095, [TON(), GRA()]);
  else if (shot === 'sil_ladies') scene('salon', t, 1.9 + .06 * push, 270, 700, [TON(), GRA()]);
  else if (shot === 'phone') phone(u);
  else if (shot === 'salon_tonton') scene('salon', t, 1.45 + .06 * push, 385, 1110, [TON({ dy: hop(t, wt('d09', 'Allons'), 34, .3) }), GRA()]);
  else if (shot === 'maquis_wide' || shot === 'maquis_grace' || shot === 'end') {
    const cast = [TON({ y: 1985 }), GRA({ y: 1985 })];
    if (shot === 'maquis_grace') scene('maquis', t, 1.4 + .05 * push, 745, 1085, cast, table);
    else scene('maquis', t, 1.0 + .03 * push, 540, 975, cast, table);
  }
  const ek = eo(lin(t, EV.end, EV.end + .45)); Object.assign(document.getElementById('endc').style, { opacity: ek, transform: `scale(${1.04 - .04 * ek})` });
  const s = SUBS.find(x => t >= x.t0 && t < x.t1), sub = document.getElementById('sub');
  sub.textContent = s ? s.text : '';
  if (s) sub.style.transform = `skewX(-7deg) scale(${.85 + .15 * back(lin(t, s.t0, s.t0 + .16))})`;
}
window.renderAt = t => drawAt(t);
window.waitFrame = () => new Promise(r => requestAnimationFrame(() => r()));
window.SFX = [[T_SIL, 'sting'], [EV.insert + .45, 'pop'], [EV.insert + 1.85, 'tap'], [T_VOILA, 'boing'], [EV.end, 'end']];
window.ready = Promise.all(Object.entries(files).map(([k, v]) => load(k, v))).then(() => document.fonts.ready).then(() => drawAt(0));
</script>
</body>
</html>
