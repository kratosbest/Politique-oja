<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sketch OJA, la cour</title>
<!-- Sketch 1 (9:16, 1080x1920): two cut-out cartoon puppets in a Cotonou courtyard at night. Boni is hungry, Sèna finds
     « Chez Maman Rose » on the map OJA. Mouths follow the voices (levels in assets/sketch1/marks.js, src/sk1_marks.py),
     eyes blink, the camera cuts between a two-shot, close-ups and an insert of the phone (app screen captured by
     src/sk1_screen.js). Puppets are built by src/sk1_prep.py. Rendered by src/sketch_cour_render.sh. -->
<link rel="stylesheet" href="fonts/local.css">
<script src="assets/sketch1/marks.js"></script>
<script src="assets/sketch1/puppets.js"></script>
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0b1224}
#cv{position:absolute;left:0;top:0;width:1080px;height:1920px}
#sub{position:absolute;left:50px;right:50px;top:330px;text-align:center;font:900 68px/1.06 Poppins;color:#FFD23F;text-transform:uppercase;
  -webkit-text-stroke:12px #2a1206;paint-order:stroke fill;transform:skewX(-7deg);letter-spacing:.5px;text-shadow:0 6px 0 rgba(42,18,6,.55)}
#endc{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(120% 80% at 50% 45%,rgba(12,18,40,.88),rgba(8,12,28,.97))}
#endc h2{margin:0;font:900 84px/1.02 Poppins;color:#fff;letter-spacing:-1.5px;-webkit-text-stroke:0}
#endc h2 span{color:#FF8A1F}
#endc .dl{margin-top:46px;display:inline-block;padding:20px 40px;border-radius:999px;background:#FF6B00;color:#fff;font:800 46px Poppins;box-shadow:0 14px 34px rgba(255,107,0,.35)}
#endc .qr{margin-top:34px;width:260px;height:260px;padding:20px;border-radius:30px;background:#fff}
#endc .qr img{width:100%;height:100%;display:block}
#endc p{margin:22px 0 0;font:600 30px Poppins;color:#D9DEEA}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="sub"></div>
<div id="endc"><h2>Les bons coins<br>près de toi,<br>sur la <span>map OJA</span></h2><div class="dl">Télécharge Oja App</div>
  <div class="qr"><img src="pubs/qr_telecharger.svg" alt=""></div><p>Play Store et App Store</p></div>
<script>
const W = 1080, H = 1920, FPS = SK.fps, DUR = SK.total;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const lin = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = x => 1 - Math.pow(1 - x, 3), eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

// ---------- images ----------
const IM = {}, load = (k, src) => new Promise(r => { const i = new Image(); i.onload = () => { IM[k] = i; r(); }; i.onerror = () => { console.error('missing ' + src); r(); }; i.src = src; });
const D = 'assets/sketch1/', NSCR = 161;
const files = { bg: D + 'cour.jpg', qr: 'pubs/qr_telecharger.svg' };
for (const n of ['boni', 'sena']) { files[n] = D + n + '.png'; files[n + '_open'] = D + n + '_mouth_open.png'; files[n + '_plate'] = D + n + '_mouth_plate.png';
  files[n + '_e0'] = D + n + '_eye0_closed.png'; files[n + '_e1'] = D + n + '_eye1_closed.png'; }
for (let i = 0; i < NSCR; i++) files['s' + i] = D + 'scr/s' + String(i).padStart(3, '0') + '.jpg';

// ---------- timeline from the voice marks ----------
const L = SK.lines;
const wt = (i, w, end) => { const x = L[i].words.find(v => v[0].startsWith(w)); return L[i].t + (x ? x[end ? 2 : 1] : 0); };
const T_A = wt(0, 'À');                  // Boni: « À cette heure-ci… » -> close-up on him
const T_MAP = wt(1, 'map');               // Sèna: « …sur la map OJA » -> the phone
const T_VOILA = wt(2, 'Voilà'), T_ROSE = wt(2, 'Chez'), T_BACK = wt(2, 'ouvert', true) + .2;
const T_VITE = [wt(3, 'Vite'), L[3].words.filter(v => v[0].startsWith('vite')).map(v => L[3].t + v[1])[0]];
const L3END = L[3].t + L[3].dur, T_TAP0 = L3END + .2, T_END = T_TAP0 + 1.25;
const SHOTS = [[0, 'wide'], [T_A - .05, 'boni'], [L[1].t - .25, 'sena'], [T_MAP - .15, 'phone'], [T_BACK, 'wide2'], [L[3].t - .25, 'boni2'], [T_TAP0, 'tap'], [T_END, 'end']];
const shotAt = t => { let k = 0; for (let i = 0; i < SHOTS.length; i++) if (t >= SHOTS[i][0]) k = i; return [SHOTS[k][1], t - SHOTS[k][0], (SHOTS[k + 1] ? SHOTS[k + 1][0] : DUR) - SHOTS[k][0]]; };

// ---------- puppets ----------
// placed with their bottom edge below the frame (cut at mid-thigh); ax = horizontal anchor in source pixels
const CH = {
  boni: { x: 300, ax: 470, s: 1.0, ph: 0.0, blinks: [1.9, 4.5, 7.4, 10.6, 12.9, 16.1, 18.6] },
  sena: { x: 800, ax: 430, s: 1.0, ph: 1.7, blinks: [2.6, 5.4, 8.1, 12.2, 15.2, 17.4] },
};
const BOTTOM = 1985;
const off = {}; for (const n in CH) { const c = document.createElement('canvas'); c.width = 848; c.height = 1264; off[n] = c; }
function mouthLevel(n, t) {
  for (const l of L) if (l.who === n && t >= l.t && t < l.t + l.dur) { const i = Math.floor((t - l.t) * FPS); return l.mouth[Math.min(i, l.mouth.length - 1)] || 0; }
  return 0;
}
function talking(n, t) { for (const l of L) if (l.who === n && t >= l.t - .05 && t < l.t + l.dur + .1) return true; return false; }
function drawPuppet(n, t) {
  const P = PUP[n], c = off[n].getContext('2d');
  c.clearRect(0, 0, 848, 1264); c.drawImage(IM[n], 0, 0);
  const lv = mouthLevel(n, t), [bx, by, bw, bh] = P.mouth_box;
  if (lv > .42) c.drawImage(IM[n + '_open'], bx, by);
  else if (lv > .12) {                              // half-open: skin plate, then the open mouth squashed under the upper lip
    c.drawImage(IM[n + '_plate'], bx, by);
    const piv = P.mouth_center[1] - (P.mouth_center[1] - by) * .62, k = .52;
    c.drawImage(IM[n + '_open'], bx, piv - (piv - by) * k, bw, bh * k);
  }
  const C = CH[n];
  if (C.blinks.some(b => t >= b && t < b + .13)) P.eyes.forEach((e, k) => c.drawImage(IM[n + '_e' + k], e[0], e[1]));
  return lv;
}
function placePuppet(n, t, extra) {
  const C = CH[n], lv = drawPuppet(n, t), sp = talking(n, t);
  const breath = .007 * Math.sin(2 * Math.PI * t / 3.3 + C.ph);
  let rot = (sp ? .7 : .25) * Math.sin(t * (sp ? 4.3 : 1.3) + C.ph) * Math.PI / 180, dy = -5 * lv, dx = 0;
  if (extra) { rot += extra.rot || 0; dy += extra.dy || 0; dx += extra.dx || 0; }
  ctx.save(); ctx.translate(C.x + dx, BOTTOM + dy); ctx.rotate(rot); ctx.scale(C.s * (1 - breath * .4), C.s * (1 + breath));
  ctx.drawImage(off[n], -C.ax, -1264); ctx.restore();
}

// ---------- camera: screen = (p - F) * z + centre; the courtyard moves a little less (depth) ----------
function scene(t, z, fx, fy, ex) {
  const zb = 1 + (z - 1) * .55, bfx = 540 + (fx - 540) * .55, bfy = 960 + (fy - 960) * .55;
  ctx.save(); ctx.translate(540, 960); ctx.scale(zb, zb); ctx.translate(-bfx, -bfy);
  const bs = W / IM.bg.width; ctx.drawImage(IM.bg, 0, (H - IM.bg.height * bs) / 2 - 10, W, IM.bg.height * bs);
  // the bulb above the door breathes a little
  const fl = .5 + .5 * Math.sin(t * 7.3) * Math.sin(t * 2.1);
  const g = ctx.createRadialGradient(408, 612, 10, 408, 612, 360); g.addColorStop(0, `rgba(255,214,140,${.16 + .05 * fl})`); g.addColorStop(1, 'rgba(255,214,140,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  ctx.save(); ctx.translate(540, 960); ctx.scale(z, z); ctx.translate(-fx, -fy);
  placePuppet('boni', t, ex && ex.boni); placePuppet('sena', t, ex && ex.sena);
  ctx.restore();
  vignette(.55);
}
function vignette(a) {
  const g = ctx.createRadialGradient(540, 900, 380, 540, 960, 1250); g.addColorStop(0, 'rgba(5,8,20,0)'); g.addColorStop(1, `rgba(5,8,20,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
let BLUR = null;
function blurredBg() {
  if (BLUR) return BLUR;
  BLUR = document.createElement('canvas'); BLUR.width = W; BLUR.height = H; const b = BLUR.getContext('2d');
  b.filter = 'blur(16px) brightness(.62)'; const s = W / IM.bg.width * 1.5;
  b.drawImage(IM.bg, (W - IM.bg.width * s) / 2, (H - IM.bg.height * s) / 2 - 120, IM.bg.width * s, IM.bg.height * s);
  return BLUR;
}
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
// the phone in close-up; frame = app screen frame index, ring = [x, y, k] tap ring in screen-image pixels
function phone(t, u, frame, ring) {
  ctx.drawImage(blurredBg(), 0, 0);
  const k = eo(lin(u, 0, .32)), bounce = back(lin(u, 0, .38));
  const SW = 560, SH = SW * 1688 / 780, PW = SW + 40, PH = SH + 40;
  ctx.save(); ctx.translate(540, 1150 + (1 - k) * 260); ctx.rotate((-3.5 + 1.2 * Math.sin(t * .9)) * Math.PI / 180); ctx.scale(.92 + .08 * bounce, .92 + .08 * bounce);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 24;
  rrect(ctx, -PW / 2, -PH / 2, PW, PH, 70); ctx.fillStyle = '#1c1e26'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 9; ctx.strokeStyle = '#2a140a'; ctx.stroke();
  ctx.save(); rrect(ctx, -SW / 2, -SH / 2, SW, SH, 50); ctx.clip();
  const img = IM['s' + Math.max(0, Math.min(NSCR - 1, Math.round(frame)))]; if (img) ctx.drawImage(img, -SW / 2, -SH / 2, SW, SH);
  if (ring) { const sc = SW / 780, rx = -SW / 2 + ring[0] * sc, ry = -SH / 2 + ring[1] * sc, q = ring[2];
    if (q > 0 && q < 1) { ctx.beginPath(); ctx.arc(rx, ry, 30 + 60 * eo(q), 0, 2 * Math.PI); ctx.strokeStyle = `rgba(255,107,0,${.9 * (1 - q)})`; ctx.lineWidth = 10; ctx.stroke();
      ctx.beginPath(); ctx.arc(rx, ry, 30 * (1 - .3 * q), 0, 2 * Math.PI); ctx.fillStyle = `rgba(255,255,255,${.55 * (1 - q)})`; ctx.fill(); } }
  ctx.restore();
  // a cartoon highlight on the glass
  ctx.save(); rrect(ctx, -SW / 2, -SH / 2, SW, SH, 56); ctx.clip(); ctx.globalAlpha = .07; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-SW / 2, -SH / 2); ctx.lineTo(SW * .1, -SH / 2); ctx.lineTo(-SW / 2, SH * .05); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.restore();
  vignette(.4);
}

// ---------- subtitles: a line is cut at sentence ends (and long commas); punctuation sticks to its word ----------
const SUBS = [];
L.forEach(l => {
  const ws = []; l.words.forEach(w => { if (/^[!?.,…]+$/.test(w[0]) && ws.length) { ws[ws.length - 1][0] += (w[0] === ',' || w[0] === '.' ? '' : ' ') + w[0]; ws[ws.length - 1][2] = w[2]; } else ws.push([...w]); });
  let cur = [];
  const flush = () => { if (cur.length) SUBS.push({ t0: l.t + cur[0][1], text: cur.map(w => w[0]).join(' '), line: l }); cur = []; };
  ws.forEach((w, i) => { cur.push(w); const s = cur.map(v => v[0]).join(' ');
    if (/[.!?]$/.test(w[0]) && i < ws.length - 1 && s.length > 9) flush(); else if (/,$/.test(w[0]) && s.length > 24 && i < ws.length - 1) flush(); });
  flush();
});
SUBS.forEach((s, i) => { const nx = SUBS[i + 1]; s.t1 = nx && nx.line === s.line ? nx.t0 : s.line.t + s.line.dur + .25; });

// ---------- one frame ----------
const T = (id, st) => Object.assign(document.getElementById(id).style, st);
function drawAt(t) {
  const [shot, u, len] = shotAt(t);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  const hop = T_VITE.reduce((a, h) => a + (t > h && t < h + .3 ? -38 * Math.sin(Math.PI * (t - h) / .3) : 0), 0);
  if (shot === 'wide') scene(t, 1.0 + .035 * u / len, 540, 960);
  else if (shot === 'boni') scene(t, 1.42 + .05 * u / len, 300, 1115);
  else if (shot === 'sena') scene(t, 1.42 + .05 * u / len, 790, 1085, { sena: { rot: -1.2 * eo(lin(t, T_MAP - .9, T_MAP - .3)) * Math.PI / 180 } });
  else if (shot === 'wide2') {
    const lean = eo(lin(u, 0, .35));
    scene(t, 1.05 + .03 * u / len, 545, 1010, { sena: { rot: -2.4 * lean * Math.PI / 180, dx: -18 * lean }, boni: { dy: -10 * eo(lin(u, .1, .3)) * (1 - lin(u, .3, .6)) } });
  }
  else if (shot === 'boni2') scene(t, 1.5 + .06 * u / len, 300, 1120 + hop * .3, { boni: { dy: hop } });
  else if (shot === 'phone') {
    let fr = Math.min(30, (t - (T_MAP + .05)) * FPS);                     // the pin drops just as he says « map OJA »
    if (t > T_ROSE - .12) fr = 133 + (t - (T_ROSE - .12)) * FPS;            // the place sheet slides up on « Chez Maman Rose »
    phone(t, u, Math.max(0, fr), [300, 776, lin(t, T_VOILA, T_VOILA + .5)]);
  }
  else if (shot === 'tap' || shot === 'end') {
    phone(t, shot === 'tap' ? u + 1 : 9, NSCR - 1, [632, 1420, lin(t, T_TAP0 + .3, T_TAP0 + .8)]);
  }
  const ek = eo(lin(t, T_END, T_END + .45)); T('endc', { opacity: ek, transform: `scale(${1.04 - .04 * ek})` });
  const s = SUBS.find(x => t >= x.t0 && t < x.t1);
  const sub = document.getElementById('sub'); sub.textContent = s ? s.text : '';
  if (s) { const p = back(lin(t, s.t0, s.t0 + .16)); sub.style.transform = `skewX(-7deg) scale(${.85 + .15 * p})`; }
}
window.renderAt = t => drawAt(t);
window.waitFrame = () => new Promise(r => requestAnimationFrame(() => r()));
// small sounds for the mix (src/sk1_audio.py reads them through src/sfx_dump.js)
window.SFX = [[T_MAP + .35, 'pop'], [T_VOILA, 'tap'], [T_ROSE - .05, 'slide'], [T_TAP0 + .3, 'tap'], [T_END, 'end'], ...T_VITE.map(h => [h, 'hop'])];
window.ready = Promise.all(Object.entries(files).map(([k, v]) => load(k, v))).then(() => document.fonts.ready).then(() => drawAt(0));
</script>
</body>
</html>
