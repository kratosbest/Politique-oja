/* ---------- canvases (same engine as the NOVOJA reel) ---------- */
const bg = $('bg').getContext('2d'), rB = $('ribB').getContext('2d'), rF = $('ribF').getContext('2d'), fx = $('fx').getContext('2d');
const BOKEH = (() => { const r = rng(7); return Array.from({ length: 34 }, () => ({ x: r() * W, y: r() * 2100, rad: 4 + r() * 22, a: .04 + r() * .14, v: 18 + r() * 60, ph: r() * 6 })); })();
function drawBg(t) {
  bg.fillStyle = '#0A0604'; bg.fillRect(0, 0, W, H);
  const pulse = .85 + .15 * Math.sin(t * 2.4);
  let g = bg.createRadialGradient(540, 900, 0, 540, 900, 1050);
  g.addColorStop(0, `rgba(255,107,0,${.34 * pulse})`); g.addColorStop(.45, 'rgba(160,52,0,.16)'); g.addColorStop(1, 'rgba(10,6,4,0)');

  for (const b of BOKEH) {

    bg.beginPath(); bg.arc(x, y, b.rad, 0, Math.PI * 2); bg.fill();
  }
}
function spline(P) {
  return s => {
    const n = P.length - 1, f = cl(s) * n, i = Math.min(n - 1, Math.floor(f)), u = f - i;
    const p0 = P[Math.max(0, i - 1)], p1 = P[i], p2 = P[i + 1], p3 = P[Math.min(n, i + 2)];
    const c = (a, b, c2, d) => .5 * (2 * b + (-a + c2) * u + (2 * a - 5 * b + 4 * c2 - d) * u * u + (-a + 3 * b - 3 * c2 + d) * u * u * u);
    return [c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])];
  };
}
const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
const C_DARK = [110, 36, 0], C_LIGHT = [255, 190, 120], C_BACK0 = [60, 18, 0], C_BACK1 = [200, 86, 16];
function ribbon(ctx, P, s0, s1, width, t, ph = 0) {
  if (s1 - s0 < .004) return;
  const f = spline(P), N = 170, pts = [];
  for (let i = 0; i <= N; i++) pts.push(f(s0 + (s1 - s0) * i / N));
  for (let i = 0; i < N; i++) {
    const s = s0 + (s1 - s0) * (i + .5) / N, u = (i + .5) / N;
    const th = s * Math.PI * 3.2 + t * 2.1 + ph, c = Math.cos(th);
    const taper = Math.min(1, u / .07, (1 - u) / .07);
    const hw = width / 2 * (.16 + .84 * Math.abs(c)) * Math.sqrt(Math.max(0, taper));
    const a = pts[i], b = pts[i + 1], pa = pts[Math.max(0, i - 1)], pb = pts[Math.min(N, i + 2)];
    let nx = -(b[1] - pa[1]), ny = b[0] - pa[0], l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    let mx = -(pb[1] - a[1]), my = pb[0] - a[0], m = Math.hypot(mx, my) || 1; mx /= m; my /= m;
    const light = Math.pow(.5 + .5 * Math.cos(th - .9), 1.6);
    const col = c >= 0 ? mix(C_DARK, C_LIGHT, light) : mix(C_BACK0, C_BACK1, light * .8);
    ctx.fillStyle = ctx.strokeStyle = `rgb(${col})`; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(a[0] + nx * hw, a[1] + ny * hw); ctx.lineTo(b[0] + mx * hw, b[1] + my * hw);
    ctx.lineTo(b[0] - mx * hw, b[1] - my * hw); ctx.lineTo(a[0] - nx * hw, a[1] - ny * hw); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}
const ell = (cx, cy, rx, ry, rot, a0, a1, n = 14) => Array.from({ length: n }, (_, i) => { const a = a0 + (a1 - a0) * i / (n - 1), x = Math.cos(a) * rx, y = Math.sin(a) * ry; return [cx + x * Math.cos(rot) - y * Math.sin(rot), cy + x * Math.sin(rot) + y * Math.cos(rot)]; });
// [front?, t0, t1, points, width, head [a,b], tail [a,b], phase]
