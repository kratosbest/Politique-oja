<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OJA — Coming soon : et si tout était plus simple ?</title>
<link rel="stylesheet" href="fonts/local.css">
<style>
*{margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
canvas{display:block}
.pre{position:absolute;left:-9999px;top:0;width:10px;height:10px}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<img class="pre" id="bg" src="assets/cs2f/f0000.jpg"><img class="pre" id="mc" src="assets/mc/c7_048.webp"><img class="pre" id="logo" src="assets/mk_logo.png">
<audio id="aud" src="assets/soundtrack_comingsoon_simple.m4a" preload="auto"></audio>
<span style="font:900 20px Poppins;position:absolute;left:-999px">A</span><span style="font:700 20px Poppins;position:absolute;left:-999px">A</span><span style="font:700 20px Inter;position:absolute;left:-999px">A</span>
<script>
const W = 1080, H = 1920, DUR = 28, FPS = 24;
const cv = document.getElementById('cv'), X = cv.getContext('2d');
const vc = document.createElement('canvas'); vc.width = W; vc.height = H; const V = vc.getContext('2d');
const tc = document.createElement('canvas'); tc.width = 612; tc.height = 960; const T = tc.getContext('2d');
const img = id => document.getElementById(id);
const bg = img('bg'), mc = img('mc');

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = u => 1 - Math.pow(1 - clamp(u), 3);
const easeIO = u => { u = clamp(u); return u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; };
const rnd = (a, b = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + 17.3) * 43758.5453; return x - Math.floor(x); };
const win = (t, a, b, f = .25) => clamp((t - a) / f) * clamp((b - t) / f);

/* ---------- timeline (voice placed by the soundtrack script) ---------- */
const CUTS = [0, 6.0, 11.3, 16.8, 18.0, 19.2, 20.4, 23.4];
const T_SIL = 23.4, T_END = 24.7, LASTF = 561;
const HITS = [[6.0, .25, .06], [11.3, .25, .06], [16.8, .35, .08], [20.4, .45, .1], [T_SIL, 1.0, .22], [T_END, 1.15, .26], [26.25, .3, .06], [27.3, .3, .06]];
const glitchAt = t => { let g = 0; for (const [h, s, d] of HITS) if (t >= h - .04 && t < h + d) g = Math.max(g, s * (1 - Math.max(0, t - h) / d)); return g; };
// captions: [start, end, lines]; a line is a list of [text, orange?]
const CAPS = [
  [0.5, 2.5, [[['Attendre une moto…']]]],
  [2.5, 5.9, [[['… qui ne s’arrête '], ['jamais.', 1]]]],
  [6.3, 8.3, [[['Avoir une boutique…']]]],
  [8.3, 11.2, [[['… que '], ['personne', 1], [' ne trouve.']]]],
  [11.8, 13.2, [[['Traverser la ville…']]]],
  [13.2, 16.7, [[['… pour un '], ['simple colis.', 1]]]],
  [20.5, 22.75, [[['Et si tout était']], [['plus simple ?', 1]]]],
  [23.45, 25.9, [[['Le Bénin bouge.']], [['Le monde avance.']]]],
  [26.2, 28.0, [[['OJA', 1], [' arrive.']]]],
];

/* ---------- helpers ---------- */
const GLY = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#%&*+<>/';
function decode(s, u, seed) {
  let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s[i]; if (' .·…’'.includes(c)) { out += c; continue; }
    const k = clamp(u * (s.length + 4) - i, 0, 1);
    out += k >= 1 ? c : k <= 0 ? ' ' : GLY[Math.floor(rnd(seed + i, Math.floor(u * 40)) * GLY.length)];
  }
  return out;
}
function spaced(ctx, s, x, y, sp) {
  const ws = [...s].map(c => ctx.measureText(c).width), tot = ws.reduce((a, b) => a + b, 0) + sp * (s.length - 1);
  let cx = x - tot / 2; ctx.textAlign = 'left';
  [...s].forEach((c, i) => { ctx.fillText(c, cx, y); cx += ws[i] + sp; });
}

/* ---------- picture ---------- */
function shot(t) {
  let i = CUTS.length - 2; while (CUTS[i] > t) i--;
  const u = (t - CUTS[i]) / (CUTS[i + 1] - CUTS[i]), z = 1 + (i === 6 ? .015 : .04) * easeIO(u);
  const w = W * z, h = H * z;
  V.drawImage(bg, (W - w) / 2, (H - h) / 2 - (z - 1) * 300, w, h);
  return i;
}
// the phones light the faces in OJA orange
function phoneGlow(t, i) {
  if (i >= 3 && i <= 5) {
    const u = clamp((t - CUTS[i] - .35) / .8);
    V.save(); V.globalCompositeOperation = 'screen';
    const g = V.createRadialGradient(470, 1150, 20, 470, 1150, 620);
    g.addColorStop(0, `rgba(255,140,40,${.42 * u})`); g.addColorStop(.5, `rgba(255,107,0,${.16 * u})`); g.addColorStop(1, 'rgba(255,107,0,0)');
    V.fillStyle = g; V.fillRect(0, 0, W, H); V.restore();
  }
  if (i === 6) {
    const u = clamp((t - 20.4) / .4);
    V.save(); V.globalCompositeOperation = 'screen';
    for (let k = 0; k < 3; k++) {
      const x = 180 + 360 * k, p = .85 + .15 * Math.sin(t * 6 + k * 2);
      const g = V.createRadialGradient(x, 1180, 10, x, 1180, 330);
      g.addColorStop(0, `rgba(255,140,40,${.5 * u * p})`); g.addColorStop(1, 'rgba(255,107,0,0)');
      V.fillStyle = g; V.fillRect(x - 360, 700, 720, 1000);
    }
    V.restore();
    // glowing separators
    V.save(); V.shadowColor = '#FF6B00'; V.shadowBlur = 20; V.fillStyle = `rgba(255,150,60,${u})`;
    const sh = H * easeIO((t - 20.4) / .45);
    V.fillRect(358, (H - sh) / 2, 4, sh); V.fillRect(718, (H - sh) / 2, 4, sh); V.restore();
    // the three lights merge into one
    const m = clamp((t - 22.55) / .8);
    if (m > 0) {
      V.fillStyle = `rgba(0,0,0,${.82 * ease(m)})`; V.fillRect(0, 0, W, H);
      V.save(); V.globalCompositeOperation = 'screen';
      for (let k = 0; k < 3; k++) {
        const x0 = 180 + 360 * k, x = x0 + (540 - x0) * easeIO(m), y = 1180 + (880 - 1180) * easeIO(m), r = 90 + 60 * m;
        const g = V.createRadialGradient(x, y, 4, x, y, r); g.addColorStop(0, 'rgba(255,220,170,.95)'); g.addColorStop(.35, 'rgba(255,107,0,.7)'); g.addColorStop(1, 'rgba(255,107,0,0)');
        V.fillStyle = g; V.fillRect(x - r, y - r, 2 * r, 2 * r);
      }
      const k = clamp((m - .7) / .3);
      if (k > 0) { const g = V.createRadialGradient(540, 880, 6, 540, 880, 200 + 700 * k); g.addColorStop(0, `rgba(255,236,215,${k})`); g.addColorStop(.4, `rgba(255,107,0,${.6 * k})`); g.addColorStop(1, 'rgba(255,107,0,0)'); V.fillStyle = g; V.fillRect(0, 0, W, H); }
      V.restore();
    }
  }
}

/* ---------- mascot silhouette, backlit ---------- */
function backgroundV() {
  V.fillStyle = '#07070a'; V.fillRect(0, 0, W, H);
  V.save(); V.strokeStyle = 'rgba(255,107,0,.05)'; V.lineWidth = 1;
  for (let x = 0; x <= W; x += 90) { V.beginPath(); V.moveTo(x + .5, 0); V.lineTo(x + .5, H); V.stroke(); }
  for (let y = 0; y <= H; y += 90) { V.beginPath(); V.moveTo(0, y + .5); V.lineTo(W, y + .5); V.stroke(); }
  V.restore();
}
function silhouette(t) {
  const u = t - T_SIL;
  backgroundV();
  const g = V.createRadialGradient(540, 820, 30, 540, 820, 760); g.addColorStop(0, `rgba(255,120,20,${.75 * ease(u / .4)})`); g.addColorStop(.45, 'rgba(255,90,0,.25)'); g.addColorStop(1, 'rgba(255,107,0,0)');
  V.fillStyle = g; V.fillRect(0, 0, W, H);
  const s = 1.32 * (1.04 - .04 * ease(u / 1.2)), w = 612 * s, h = 960 * s, x = 540 - w / 2, y = 1500 - h;
  // rim light: blurred orange copy
  T.clearRect(0, 0, 612, 960); T.globalCompositeOperation = 'source-over'; T.drawImage(mc, 0, 0);
  T.globalCompositeOperation = 'source-in'; T.fillStyle = '#FF8A1F'; T.fillRect(0, 0, 612, 960);
  V.save(); V.filter = 'blur(14px)'; V.globalAlpha = .9 * ease(u / .3); V.drawImage(tc, x - 8, y - 8, w + 16, h + 16); V.restore();
  T.globalCompositeOperation = 'source-over'; T.clearRect(0, 0, 612, 960); T.drawImage(mc, 0, 0);
  T.globalCompositeOperation = 'source-in'; T.fillStyle = '#050506'; T.fillRect(0, 0, 612, 960);
  V.save(); V.globalAlpha = ease(u / .25); V.drawImage(tc, x, y, w, h); V.restore();
}

/* ---------- end card: partial logo through a slit ---------- */
function endCardV(t) {
  const u = t - T_END;
  backgroundV();
  const LS = 700, bc = 760, LX = 540 - LS / 2, LY = bc - LS * 377 / 1024;
  const sh = 330 * easeIO(u / .38) + 30 * easeIO((u - 1.1) / .8);
  const gl = V.createRadialGradient(540, bc, 10, 540, bc, 520); gl.addColorStop(0, `rgba(255,107,0,${.32 * ease(u / .5)})`); gl.addColorStop(1, 'rgba(255,107,0,0)');
  V.fillStyle = gl; V.fillRect(0, bc - 520, W, 1040);
  V.save(); V.beginPath(); V.rect(0, bc - sh / 2, W, sh); V.clip(); V.drawImage(img('logo'), LX, LY, LS, LS); V.restore();
  V.save(); V.shadowColor = '#FF6B00'; V.shadowBlur = 24; V.fillStyle = `rgba(255,170,90,${clamp(u / .1)})`;
  V.fillRect(0, bc - sh / 2 - 2, W, 4); V.fillRect(0, bc + sh / 2 - 2, W, 4); V.restore();
  V.save(); V.textBaseline = 'alphabetic';
  V.font = '900 168px Poppins'; V.fillStyle = '#fff';
  const k1 = clamp((u - .35) / .45); if (k1 > 0) spaced(V, decode('BIENTÔT', k1, 300), 540, 1225, 6);
  V.font = '700 38px Inter'; V.fillStyle = '#FF6B00';
  const k2 = clamp((u - .7) / .5); if (k2 > 0) spaced(V, decode('AU BÉNIN · COMING SOON', k2, 400), 540, 1315, 16);
  V.restore();
}

/* ---------- post: glitch, grain, vignette, captions ---------- */
const grains = [0, 1, 2, 3].map(s => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), d = g.createImageData(256, 256);
  for (let i = 0; i < d.data.length; i += 4) { const v = rnd(i * .37 + s * 1000, s) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); return c; });
function captions(t) {
  X.save(); X.font = '700 60px Poppins'; X.textBaseline = 'middle'; X.textAlign = 'left';
  for (const [a, b, lines] of CAPS) {
    const al = win(t, a, b, .18); if (al <= 0) continue;
    const dy = 14 * (1 - ease((t - a) / .25));
    lines.forEach((segs, k) => {
      const y = 1540 + (k - (lines.length - 1) / 2) * 76 + dy;
      const tot = segs.reduce((s, [txt]) => s + X.measureText(txt).width, 0); let x = 540 - tot / 2;
      for (const [txt, o] of segs) {
        X.shadowColor = 'rgba(0,0,0,.85)'; X.shadowBlur = 18; X.fillStyle = o ? `rgba(255,122,26,${al})` : `rgba(255,255,255,${al})`;
        X.fillText(txt, x, y); x += X.measureText(txt).width;
      }
    });
  }
  X.restore();
}
function post(t, fi) {
  const g = glitchAt(t);
  X.globalCompositeOperation = 'source-over'; X.drawImage(vc, 0, 0);
  if (g > .02) {
    const n = 6 + Math.floor(10 * g);
    for (let k = 0; k < n; k++) {
      const y = Math.floor(rnd(fi, k) * H), h = 8 + Math.floor(rnd(fi, k + 50) * 130 * g), dx = (rnd(fi, k + 99) - .5) * 220 * g;
      X.drawImage(vc, 0, y, W, h, dx, y, W, h);
    }
    const s = Math.round(5 + 22 * g), id = X.getImageData(0, 0, W, H), d = id.data, src = new Uint8ClampedArray(d);
    for (let y = 0; y < H; y++) { const row = y * W * 4;
      for (let x = 0; x < W; x++) { const i = row + x * 4; d[i] = src[row + Math.min(W - 1, x + s) * 4]; d[i + 2] = src[row + Math.max(0, x - s) * 4 + 2]; } }
    X.putImageData(id, 0, 0);
  }
  X.save(); X.globalAlpha = .05; X.globalCompositeOperation = 'screen';
  const gc = grains[fi % 4], ox = Math.floor(rnd(fi, 1) * 256), oy = Math.floor(rnd(fi, 2) * 256);
  for (let y = -oy; y < H; y += 256) for (let x = -ox; x < W; x += 256) X.drawImage(gc, x, y);
  X.restore();
  // soft dark gradient at the bottom so the captions read on any picture
  const bgr = X.createLinearGradient(0, 1220, 0, H); bgr.addColorStop(0, 'rgba(0,0,0,0)'); bgr.addColorStop(1, 'rgba(0,0,0,.55)');
  X.fillStyle = bgr; X.fillRect(0, 1220, W, H - 1220);
  const v = X.createRadialGradient(540, 960, 650, 540, 960, 1300); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.45)');
  X.fillStyle = v; X.fillRect(0, 0, W, H);
  if (t < .4) { X.fillStyle = `rgba(0,0,0,${1 - ease(t / .4)})`; X.fillRect(0, 0, W, H); }
  captions(t);
}

let curSrc = '', curMc = '';
const setSrc = async (el, src, cur) => { if (src !== cur) el.src = src; await el.decode().catch(() => 0); return src; };
window.renderAt = async t => {
  const fi = Math.round(t * FPS);
  if (t < T_SIL) {
    curSrc = await setSrc(bg, `assets/cs2f/f${String(Math.min(fi, LASTF)).padStart(4, '0')}.jpg`, curSrc);
    const i = shot(t); phoneGlow(t, i);
  } else if (t < T_END) {
    const f = 48 + Math.min(30, Math.round((t - T_SIL) * FPS));
    curMc = await setSrc(mc, `assets/mc/c7_${String(f).padStart(3, '0')}.webp`, curMc);
    silhouette(t);
  } else endCardV(t);
  post(t, fi);
};
window.waitFrame = () => 0;
window.ready = (async () => {
  for (const f of ['900 168px Poppins', '700 60px Poppins', '700 38px Inter']) await document.fonts.load(f);
  await document.fonts.ready; await img('logo').decode().catch(() => 0);
  await window.renderAt(0);
  return true;
})();
if (location.search.includes('play')) {
  const a = document.getElementById('aud'); let t0 = null, busy = false;
  const fit = () => { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.transform = `scale(${s})`; cv.style.transformOrigin = '0 0'; };
  fit(); addEventListener('resize', fit);
  const loop = async () => { if (!busy) { busy = true; const t = a && !a.paused ? a.currentTime : (t0 === null ? 0 : (performance.now() - t0) / 1000); await window.renderAt(t % DUR); busy = false; } requestAnimationFrame(loop); };
  document.addEventListener('click', () => { a.currentTime = 0; a.play().catch(() => { t0 = performance.now(); }); });
  window.ready.then(loop);
}

</script>
</body>
</html>
