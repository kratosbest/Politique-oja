<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>OJA Mascotte — Ajouter un lieu</title>
<link rel="stylesheet" href="fonts/local.css">
<style>
:root{--or:#FF6B00;--or2:#FF8A1F;--deep:#C2410C;--ink:#0E0F14;--ink2:#15171F;--cream:#FFF5EB;--g:#008751;--y:#FCD116;--r:#E8112D;--mute:#8A90A2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;background:var(--ink);color:#fff}
.scene{position:absolute;inset:0;overflow:hidden;display:none}
.abs{position:absolute}
.H{font-family:Poppins;font-weight:800;letter-spacing:-.025em;line-height:1.02}
.wm{display:inline-block;overflow:hidden;vertical-align:top;padding:.04em .03em .12em;margin:-.04em -.03em -.12em}
.wi{display:inline-block;will-change:transform}
.hl{color:var(--or)}
.c{transform-origin:50% 50%}
.phone{position:absolute;width:440px;height:920px;border-radius:66px;background:#0b0b0f;padding:12px;box-shadow:0 0 0 2px #30303a inset,0 0 0 4px #1d1d24,0 70px 120px rgba(0,0,0,.55)}
.screen{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:#1A2130}
.island{position:absolute;top:13px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:6}
.sbar{position:absolute;top:18px;left:38px;right:30px;display:flex;justify-content:space-between;align-items:center;color:#fff;font:600 17px Inter;z-index:5}
.sheet{position:absolute;left:0;width:416px;border-radius:26px 26px 0 0;overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.35)}
.sheet img{display:block;width:416px}
.kicker{display:inline-flex;align-items:center;gap:12px;padding:10px 22px;border-radius:40px;background:rgba(255,107,0,.14);color:var(--or);font:700 24px Inter;letter-spacing:.18em}
.chip{position:absolute;display:flex;align-items:center;gap:14px;padding:16px 26px;border-radius:22px;background:#fff;color:var(--ink);font:600 26px Inter;box-shadow:0 20px 50px rgba(0,0,0,.35);white-space:nowrap}
.chip .ci{width:46px;height:46px;border-radius:14px;background:#FFF1E6;display:grid;place-items:center}
.frow{position:absolute;display:flex;align-items:center;gap:26px}
.fic{width:78px;height:78px;border-radius:22px;background:rgba(255,107,0,.14);display:grid;place-items:center}
.flab{font:600 46px Poppins;color:#fff}
.vcard{position:absolute;width:470px;height:560px;border-radius:40px;background:#fff;box-shadow:0 40px 80px rgba(194,65,12,.16);color:var(--ink);overflow:visible}
.vcard .disc{position:absolute;left:85px;top:40px;width:300px;height:300px;border-radius:50%;background:#FFEBDC}
.vcard .vimg{position:absolute;filter:drop-shadow(0 18px 18px rgba(0,0,0,.18))}
.vcard .veh{position:absolute;left:35px;top:95px;width:400px;overflow:visible}
.vcard .vn{position:absolute;left:44px;top:370px;font:800 52px Poppins;letter-spacing:-.01em}
.vcard .cap{position:absolute;left:44px;top:440px;display:flex;gap:10px;align-items:center;font:600 26px Inter;color:#5b6070}
.vcard .pr{position:absolute;right:44px;top:436px;font:800 38px Poppins;color:var(--deep)}
.vcard .tag{position:absolute;right:40px;top:382px;padding:8px 18px;border-radius:30px;background:var(--ink);color:#fff;font:700 20px Inter;letter-spacing:.06em}
.vcard .ok{position:absolute;right:-18px;top:-18px;width:76px;height:76px;border-radius:50%;background:#12B76A;display:grid;place-items:center;box-shadow:0 12px 30px rgba(18,183,106,.45)}
.band{position:absolute;top:-10%;left:-20%;width:140%;height:120%}
.ucard{position:absolute;width:500px;height:500px;border-radius:40px;background:#1B1E29;border:2px solid #2A2E3D}
.ucard .uic{position:absolute;left:50px;top:56px;width:150px;height:150px;border-radius:44px;background:linear-gradient(135deg,#FF8A1F,#E85D00);display:grid;place-items:center;box-shadow:0 20px 50px rgba(255,107,0,.35)}
.ucard .ut{position:absolute;left:50px;top:258px;font:800 50px Poppins;line-height:1.08;color:#fff;letter-spacing:-.02em}
.ucard .us{position:absolute;left:50px;top:386px;font:500 30px Inter;color:#9AA0B4}
.ucard .un{position:absolute;right:46px;top:60px;font:800 40px Poppins;color:#3a3f52}
.pill{position:absolute;display:flex;align-items:center;gap:12px;padding:14px 24px;border-radius:40px;font:700 26px Inter;white-space:nowrap}
.store{position:absolute;width:330px;height:104px;border-radius:26px;background:var(--ink);display:flex;align-items:center;gap:18px;padding:0 28px;color:#fff}
.store small{display:block;font:500 18px Inter;opacity:.75}
.store b{display:block;font:700 34px Poppins;letter-spacing:-.01em;line-height:1.1}
#grain{position:absolute;inset:-100px;pointer-events:none;opacity:.07;mix-blend-mode:overlay;z-index:50}
#vig{position:absolute;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.28) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;z-index:60}
</style>
</head>
<body>
<div id="stage"></div>
<audio id="aud" src="assets/soundtrack_mascot.m4a" preload="auto"></audio>
<script>
/* ============================================================
   OJA Transport — 65 s motion piece, driven by renderAt(t).
   Every frame is a pure function of time => deterministic render.
   ============================================================ */
const DUR = 57.0;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: x => x,
  oC: x => 1 - Math.pow(1 - x, 3),
  iC: x => x * x * x,
  ioC: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  oQ: x => 1 - Math.pow(1 - x, 4),
  oE: x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x),
  iE: x => x === 0 ? 0 : Math.pow(2, 10 * x - 10),
  ioE: x => x === 0 ? 0 : x === 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  oB: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  oB2: x => { const c1 = 2.8, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  oEl: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI) / 3) + 1,
  oBo: x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; },
};
const P = (t, a, d, e = E.oC) => e(clamp((t - a) / d));
// keyframe interpolation: [[t,v],...]
function KF(t, kf, e = E.ioC) {
  if (t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++) if (t <= kf[i][0]) { const [t0, v0] = kf[i - 1], [t1, v1] = kf[i]; return lerp(v0, v1, e((t - t0) / (t1 - t0))); }
  return kf[kf.length - 1][1];
}
const cache = {};
const el = id => (typeof id === 'string' ? (cache[id] || (cache[id] = $(id))) : id);
function T(id, o) {
  const e = el(id); if (!e) return;
  const { x = 0, y = 0, s = 1, sx = s, sy = s, r = 0, rx = 0, ry = 0, sk = 0 } = o;
  e.style.transform = `perspective(1800px) translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) skewX(${sk}deg) scale(${sx},${sy})`;
  if (o.o !== undefined) { e.style.opacity = o.o; e.style.visibility = o.o <= .001 ? 'hidden' : 'visible'; }
}
const O = (id, o) => { const e = el(id); e.style.opacity = o; e.style.visibility = o <= .001 ? 'hidden' : 'visible'; };
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- text builders ---------- */
// "*word*" => highlighted word
function W(str, hl = 'hl') {
  return str.split(' ').map(w => { const h = /^\*.*\*[.,?!]?$/.test(w); const txt = w.replace(/\*/g, ''); return `<span class="wm"><span class="wi ${h ? hl : ''}">${txt}</span></span>`; }).join(' ');
}
function L(str, hl = '') { return [...str].map(ch => `<span class="wm"><span class="wi ${hl}">${ch === ' ' ? '&nbsp;' : ch}</span></span>`).join(''); }
function wordsIn(id, t, t0, st = .08, dur = .55, ease = E.oE, exitAt = null, exitDur = .4, from = 115) {
  const ws = el(id).querySelectorAll('.wi');
  ws.forEach((w, i) => {
    const p = P(t, t0 + i * st, dur, ease);
    let y = (1 - p) * from, r = (1 - p) * 8;
    if (exitAt !== null) { const q = P(t, exitAt + i * st * .4, exitDur, E.iC); y -= q * 118; }
    w.style.transform = `translateY(${y}%) rotate(${r}deg)`;
    w.style.visibility = (p <= 0 || y <= -117) ? 'hidden' : 'visible';
  });
}

/* ---------- icons ---------- */
const ICONS = {
  clock: '<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  calendar: '<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
  route: '<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
  car: '<path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><path d="M9 17h6"/><circle cx="17" cy="17" r="2"/>',
  search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',

  pkg: '<path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
  heart: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
  bag: '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
  swap: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',

  user: '<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  nav: '<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
  phone: '<rect width="14" height="20" x="5" y="2" rx="2" ry="2"/><path d="M12 18h.01"/>',
  play: '<polygon points="6 3 20 12 6 21 6 3"/>',
  star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
  bike: '<circle cx="5.5" cy="17.5" r="3.5"/><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/>',
  truck: '<path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/>',
  wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  zap: '<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',
};
const ic = (n, s = 24, c = 'currentColor', w = 2, f = 'none') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;

/* ---------- vehicles (flat illustration) ---------- */
const wheel = (cx, cy, r) => `<g class="wh" data-c="${cx},${cy}" transform="translate(${cx},${cy})"><circle r="${r}" fill="#15161c"/><circle r="${r * .56}" fill="#d9dce3"/><path d="M${-r * .5},0H${r * .5}M0,${-r * .5}V${r * .5}" stroke="#8a8f9c" stroke-width="${r * .13}"/><circle r="${r * .15}" fill="#555a66"/></g>`;
function carSVG(color = '#FF6B00') {
  return `<svg viewBox="0 0 300 150" class="veh"><ellipse cx="150" cy="138" rx="132" ry="8" fill="rgba(0,0,0,.2)"/><g class="vb">
<path d="M18,98 Q18,74 44,70 L86,64 Q112,34 150,32 L192,32 Q222,34 246,62 L270,68 Q290,72 290,94 L290,108 Q290,116 280,116 L26,116 Q18,116 18,108Z" fill="${color}"/>
<path d="M98,64 Q120,42 150,41 L166,41 L166,64Z" fill="#1d2230"/><path d="M176,41 L192,41 Q218,43 234,64 L176,64Z" fill="#1d2230"/>
<path d="M104,60 Q122,46 140,45" stroke="rgba(255,255,255,.35)" stroke-width="4" fill="none" stroke-linecap="round"/>
<path d="M20,94 L290,94" stroke="rgba(0,0,0,.14)" stroke-width="4"/><path d="M168,66 L168,112" stroke="rgba(0,0,0,.14)" stroke-width="3"/>
<rect x="272" y="78" width="16" height="9" rx="4" fill="#FFE8A3"/><rect x="18" y="80" width="11" height="8" rx="3" fill="#E8112D"/></g>
${wheel(78, 114, 24)}${wheel(226, 114, 24)}</svg>`;
}
function motoSVG(box = false) {
  return `<svg viewBox="0 0 300 200" class="veh"><ellipse cx="152" cy="188" rx="122" ry="7" fill="rgba(0,0,0,.2)"/><g class="vb">
${box ? `<g><rect x="40" y="62" width="76" height="64" rx="8" fill="#FF6B00"/><rect x="40" y="62" width="76" height="16" rx="8" fill="#C2410C"/><text x="78" y="113" font-family="Poppins" font-weight="800" font-size="22" fill="#fff" text-anchor="middle">OJA</text></g>` : ''}
<path d="M72,160 L118,124 L196,124 L232,160" stroke="#23252e" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M108,112 L205,112 Q222,112 220,124 L208,140 L118,140 Q102,138 108,112Z" fill="#FF6B00"/>

<circle cx="248" cy="100" r="8" fill="#FFE8A3"/>
<path d="M140,104 L176,134 L188,156" stroke="#1f3a8a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M124,108 L146,50 Q150,42 160,44 L176,48 Q184,52 180,62 L162,108Z" fill="#FCD116"/>
<path d="M170,60 L234,80" stroke="#FCD116" stroke-width="15" stroke-linecap="round"/><circle cx="236" cy="80" r="7" fill="#6b3f24"/>
<circle cx="164" cy="30" r="17" fill="#6b3f24"/><path d="M145,31 A19,19 0 0 1 183,26 L186,33 L145,33Z" fill="#15161c"/></g>
${wheel(72, 160, 27)}${wheel(232, 160, 27)}</svg>`;
}
function trikeSVG() {
  return `<svg viewBox="0 0 300 190" class="veh"><ellipse cx="152" cy="176" rx="128" ry="7" fill="rgba(0,0,0,.2)"/><g class="vb">
<path d="M36,150 L36,70 Q36,36 74,32 L196,32 Q236,36 252,74 L268,128 Q270,150 256,150Z" fill="#FF8A1F"/>
<path d="M28,42 Q32,22 62,20 L206,20 Q234,22 242,42Z" fill="#15161c"/>

<path d="M70,60 L96,60" stroke="rgba(255,255,255,.3)" stroke-width="4" stroke-linecap="round"/>
<rect x="36" y="112" width="232" height="10" fill="#008751"/><rect x="36" y="122" width="232" height="6" fill="#FCD116"/><rect x="36" y="128" width="232" height="6" fill="#E8112D"/>
<circle cx="258" cy="116" r="7" fill="#FFE8A3"/></g>
${wheel(82, 150, 25)}${wheel(232, 150, 25)}</svg>`;
}
function boxSVG() {
  return `<svg viewBox="0 0 240 240" width="100%" height="100%" style="overflow:visible"><ellipse cx="120" cy="228" rx="92" ry="11" fill="rgba(0,0,0,.22)"/>
<path d="M120,20 L220,64 L120,108 L20,64Z" fill="#EBC08A"/><path d="M20,64 L120,108 L120,220 L20,176Z" fill="#CF9150"/><path d="M220,64 L120,108 L120,220 L220,176Z" fill="#B47A3E"/>
<path d="M58,47 L78,38 L182,82 L162,91Z" fill="#FF6B00"/><path d="M162,91 L182,82 L182,194 L162,203Z" fill="#E85D00"/>
<g transform="translate(40,120) skewY(24)"><rect width="58" height="34" rx="5" fill="#fff" opacity=".92"/><text x="29" y="24" font-family="Poppins" font-weight="800" font-size="19" fill="#FF6B00" text-anchor="middle">OJA</text></g></svg>`;
}
function spinWheels(root, deg) { el(root).querySelectorAll('.wh').forEach(w => { w.setAttribute('transform', `translate(${w.dataset.c}) rotate(${deg})`); }); }
function bob(root, t, amp = 1.5, f = 14) { el(root).querySelectorAll('.vb').forEach(g => g.setAttribute('transform', `translate(0,${Math.sin(t * f) * amp})`)); }

/* ---------- maps ---------- */
function roads(seed, w, h, n, col = '#263044') {
  const R = rng(seed); let s = '';
  for (let i = 0; i < n * 3; i++) { const x = R() * w, y = R() * h, bw = 20 + R() * 60, bh = 14 + R() * 40; s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="#1F2737" transform="rotate(${-18 + R() * 6},${x},${y})"/>`; }
  for (let i = 0; i < n; i++) { const y = R() * h * 1.2 - h * .1; s += `<path d="M${-60},${y} L${w + 60},${y - w * .3 + (R() - .5) * 120}" stroke="${col}" stroke-width="${1.5 + R() * 2.5}" fill="none"/>`; }
  for (let i = 0; i < n; i++) { const x = R() * w * 1.2 - w * .1; s += `<path d="M${x},${-60} L${x + h * .32 + (R() - .5) * 120},${h + 60}" stroke="${col}" stroke-width="${1.5 + R() * 2.5}" fill="none"/>`; }
  return s;
}
function miniMap(id, seed, route) {
  return `<svg class="abs" style="left:0;top:0" width="416" height="896" viewBox="0 0 416 896">
<rect width="416" height="896" fill="#1A2130"/>${roads(seed, 416, 896, 22)}
<path d="M-20,300 C120,260 260,330 440,250" stroke="#34405A" stroke-width="9" fill="none"/>

// face state: gaze -1..1, blink 0..1, brow -1..1, smile 0..1, talk from VIS
function face(id, t, o = {}) {
  const { gx = 0, gy = 0, brow = 0, smile = .6, blinkExtra = 0, mute = false } = o;
  const fr = Math.min(VIS.length - 1, Math.max(0, Math.floor(t * 60)));

  [MG.L, MG.R].forEach(([x, y, ex, ey, pr], i) => {
    const px = x + gx * (ex - pr - 8), py = y + gy * (ey - pr - 10);
    $(id + 'p' + i).setAttribute('transform', `translate(${px},${py})`);
    $(id + 'lid' + i).setAttribute('transform', `translate(0,${b * (2 * ey + 6) + Math.max(0, -brow) * 18})`);
    $(id + 'llid' + i).setAttribute('transform', `translate(0,${-smile * 22 - b * 30})`);
  });
  const talk = op * 6;
  $(id + 'bL').setAttribute('transform', `translate(${MG.bL[0] + gx * 10},${MG.bL[1] - brow * 26 - talk}) rotate(${-brow * 6})`);
  $(id + 'bR').setAttribute('transform', `translate(${MG.bR[0] + gx * 10},${MG.bR[1] - brow * 26 - talk}) rotate(${brow * 6})`);
