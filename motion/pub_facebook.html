<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>OJA — pub Facebook</title>
<link rel="stylesheet" href="fonts/local.css">
<style>
/* Facebook / Instagram ad for Oja App (9 Nov 2026), after the « Griokids » ad Derrick sent: flat brand colour, logo, one big line,
   the app on real phones, store badges. Made as a real layout, not a generated picture: real logo, real screens of the app
   (assets/frm/: amounts blurred, test listing replaced by a fictitious one), real type.
   #feed = 1080 x 1350 (4:5, news feed), #story = 1080 x 1920 (9:16, stories and reels). Built by src/pub_facebook_build.js. */
:root { --or: #FF6B00; --or2: #F05A00; --ink: #17110B; --cream: #FFF4EA; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; overflow: hidden; background: var(--or); }
body { font-family: 'Inter', sans-serif; color: #fff; }
.ad { position: relative; width: 1080px; height: 1350px; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #FF8A2E 0%, var(--or) 45%, var(--or2) 100%); }
body.story .ad { height: 1920px; }
/* the map behind: rings around a pin and a dotted route, very light */
svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.top { position: absolute; left: 0; right: 0; top: 64px; display: flex; flex-direction: column; align-items: center; }
.icon { width: 112px; height: 112px; border-radius: 28px; background: #fff; display: grid; place-items: center;
  box-shadow: 0 14px 30px rgba(120, 40, 0, .28); }
.icon img { width: 118%; height: 118%; object-fit: contain; margin-top: 6%; }
.name { margin-top: 14px; font: 800 30px 'Poppins'; letter-spacing: .5px; }
.name span { opacity: .8; font-weight: 600; }
h1 { margin-top: 30px; text-align: center; font: 900 96px/0.98 'Poppins'; letter-spacing: -1.5px; text-transform: uppercase; }
h1 .dark { color: var(--ink); display: block; }
.sub { margin-top: 22px; text-align: center; font: 600 33px/1.3 'Inter'; color: var(--cream); }
.phones { position: absolute; left: 0; right: 0; }
.phone { position: absolute; border-radius: 58px; background: #0B0C0E; padding: 13px;
  box-shadow: 0 40px 70px rgba(90, 25, 0, .45), 0 0 0 3px #2A2B2F inset; }
.phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 46px; }
.chip { position: absolute; display: flex; align-items: center; gap: 14px; background: #fff; color: var(--ink);
  border-radius: 999px; padding: 16px 26px 16px 16px; font: 700 29px 'Inter'; white-space: nowrap;
  box-shadow: 0 18px 34px rgba(90, 25, 0, .3); }
.chip i { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: #159A69; flex: none; }
.chip i.or { background: var(--or); }
.chip svg { width: 26px; height: 26px; }
.stores { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 22px; }
.badge { display: flex; align-items: center; gap: 14px; background: #000; border-radius: 18px; padding: 14px 30px 14px 22px;
  border: 2px solid rgba(255, 255, 255, .25); }
.badge img { width: 50px; height: 50px; }
.badge small { display: block; font: 500 17px 'Inter'; letter-spacing: .4px; }
.badge b { display: block; font: 600 33px/1.05 'Inter'; letter-spacing: -.3px; }
/* feed (4:5) */
.phones { top: 585px; height: 620px; }
.p1 { left: 250px; top: 0; width: 276px; height: 600px; transform: rotate(-4deg); z-index: 2; }
.p2 { left: 540px; top: 34px; width: 254px; height: 552px; transform: rotate(6deg); z-index: 1; }
.c1 { left: 520px; top: 700px; z-index: 3; transform: rotate(3deg); }
.c2 { left: 70px; top: 1010px; z-index: 3; transform: rotate(-3deg); }
.stores { top: 1222px; }
/* story (9:16): same pieces, more air, everything inside the safe area (no text in the top 250 px or the bottom 340 px) */
body.story .top { top: 250px; }
body.story h1 { font-size: 104px; }
body.story .phones { top: 805px; }
body.story .p1 { left: 225px; width: 300px; height: 652px; }
body.story .p2 { left: 540px; top: 40px; width: 276px; height: 600px; }
body.story .c1 { left: 515px; top: 930px; }
body.story .c2 { left: 60px; top: 1290px; }
body.story .stores { top: 1488px; }
</style></head>
<body>
<div class="ad">
  <svg class="bg" viewBox="0 0 1080 1350" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g fill="none" stroke="#fff">
      <circle cx="540" cy="930" r="250" stroke-opacity=".10" stroke-width="2"/>
      <circle cx="540" cy="930" r="390" stroke-opacity=".07" stroke-width="2"/>
      <circle cx="540" cy="930" r="540" stroke-opacity=".05" stroke-width="2"/>
      <path d="M-40 1180 C 180 1090, 160 860, 380 800 S 760 820, 1120 560" stroke-opacity=".22" stroke-width="5" stroke-dasharray="2 18" stroke-linecap="round"/>
    </g>
  </svg>
  <div class="top">
    <div class="icon"><img src="../video1/assets/logo-oja-carte.png" alt=""></div>
    <div class="name">Oja <span>App</span></div>
    <h1>Le marché<span class="dark">dans ta poche</span></h1>
    <p class="sub">Course, colis, repas, bonnes adresses.<br>Une seule appli, faite au Bénin.</p>
  </div>
  <div class="phones">
    <div class="phone p2"><img src="assets/frm/course_m.jpg" alt=""></div>
    <div class="phone p1"><img src="assets/frm/accueil_m.jpg" alt=""></div>
  </div>
  <div class="chip c1"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i>Prix affiché avant de partir</div>
  <div class="chip c2"><i class="or"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/></svg></i>Paiement Mobile Money</div>
  <div class="stores">
    <div class="badge"><img src="../video1/assets/store-app-store.png" alt=""><div><small>Télécharger dans</small><b>l'App Store</b></div></div>
    <div class="badge"><img src="../video1/assets/store-google-play.png" alt=""><div><small>DISPONIBLE SUR</small><b>Google Play</b></div></div>
  </div>
</div>
<script>
if (location.hash === '#story') { document.body.classList.add('story'); document.querySelector('svg.bg').setAttribute('viewBox', '0 -150 1080 1920'); }
</script>
</body></html>
