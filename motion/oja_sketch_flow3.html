<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sketch OJA, Je-connais-tout</title>
<!-- Sketch 3 « Monsieur Je-connais-tout » (9:16, 1080x1920): the Google Flow (Veo) clips (clips_sk3/, frames extracted to
     assets/sketch3/frames/ by src/sketch_flow3_render.sh), cut and joined as planned in assets/sketch3/marks.js
     (src/sk3_marks.py), new voices (src/sk3_dub.py) with yellow subtitles, the phone with the map OJA (screen captured by
     src/sk_screen.js into assets/sketch3/scr/) and the end card with the download QR code. -->
<link rel="stylesheet" href="fonts/local.css">
<script src="assets/sketch3/marks.js"></script>
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
#cv{position:absolute;left:0;top:0;width:1080px;height:1920px}
#sub{position:absolute;left:44px;right:44px;top:1400px;text-align:center;font:900 64px/1.08 Poppins;color:#FFD23F;text-transform:uppercase;
  -webkit-text-stroke:11px #2a1206;paint-order:stroke fill;transform:skewX(-7deg);letter-spacing:.3px;text-shadow:0 6px 0 rgba(42,18,6,.55)}
#endc{position:absolute;inset:0;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(120% 80% at 50% 45%,rgba(12,18,40,.82),rgba(8,12,28,.95))}
#endc .k{font:800 46px Poppins;color:#FFD23F;margin-bottom:18px}
#endc h2{margin:0;font:900 80px/1.03 Poppins;color:#fff;letter-spacing:-1.5px}
#endc h2 span{color:#FF8A1F}
#endc .dl{margin-top:44px;display:inline-block;padding:20px 40px;border-radius:999px;background:#FF6B00;color:#fff;font:800 46px Poppins;box-shadow:0 14px 34px rgba(255,107,0,.35)}
#endc .qr{margin-top:32px;width:250px;height:250px;padding:20px;border-radius:30px;background:#fff}
#endc .qr img{width:100%;height:100%;display:block}
#endc p{margin:20px 0 0;font:600 30px Poppins;color:#D9DEEA}
</style>
</head>
<body>
<canvas id="cv" width="1080" height="1920"></canvas>
<div id="sub"></div>
<div id="endc"><div class="k">Ne te perds plus.</div><h2>Les lieux près de toi<br>sont sur la <span>map OJA</span></h2><div class="dl">Télécharge Oja App</div>
  <div class="qr"><img src="pubs/qr_telecharger.svg" alt=""></div><p>Play Store et App Store</p></div>
<script>
const W = 1080, H = 1920, DUR = SK3.total, EV = SK3.ev, NF = 190, NSCR = 161;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const lin = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = x => 1 - Math.pow(1 - x, 3);
const back = x => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const loadImg = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.error('missing ' + src); r(null); }; i.src = src; });
const frameSrc = (clip, ct) => `assets/sketch3/frames/${clip}/f${String(Math.min(NF, Math.max(1, Math.floor(ct * SK3.fps_src) + 1))).padStart(4, '0')}.jpg`;
const SCR = [];
let BLUR = null;

function segAt(t) { let s = SK3.segs[0]; for (const x of SK3.segs) if (t >= x.t) s = x; return s; }
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function cover(img) { ctx.drawImage(img, 0, 0, W, H); }
function phone(u) {
  ctx.drawImage(BLUR, 0, 0);
  const k = eo(lin(u, 0, .3)), bounce = back(lin(u, 0, .36));
  const SW = 560, SH = SW * 1688 / 780, PW = SW + 40, PH = SH + 40;
  ctx.save(); ctx.translate(540, 1010 + (1 - k) * 260); ctx.rotate((-3 + 1.0 * Math.sin(u * 1.1)) * Math.PI / 180); ctx.scale(.92 + .08 * bounce, .92 + .08 * bounce);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 24;
  rrect(ctx, -PW / 2, -PH / 2, PW, PH, 70); ctx.fillStyle = '#1c1e26'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 6; ctx.strokeStyle = '#0d0e12'; ctx.stroke();
  ctx.save(); rrect(ctx, -SW / 2, -SH / 2, SW, SH, 50); ctx.clip();
  let fr = Math.min(30, (u - .15) * 30); if (u > .95) fr = 133 + (u - .95) * 30;
  const img = SCR[Math.max(0, Math.min(NSCR - 1, Math.round(fr)))]; if (img) ctx.drawImage(img, -SW / 2, -SH / 2, SW, SH);
  const q = lin(u, 1.85, 2.35);                     // tap on « Itinéraire »
  if (q > 0 && q < 1) { const sc = SW / 780, rx = -SW / 2 + 146 * sc, ry = -SH / 2 + 1420 * sc;
    ctx.beginPath(); ctx.arc(rx, ry, 30 + 60 * eo(q), 0, 2 * Math.PI); ctx.strokeStyle = `rgba(255,107,0,${.9 * (1 - q)})`; ctx.lineWidth = 10; ctx.stroke();
    ctx.beginPath(); ctx.arc(rx, ry, 30 * (1 - .3 * q), 0, 2 * Math.PI); ctx.fillStyle = `rgba(255,255,255,${.55 * (1 - q)})`; ctx.fill(); }
  ctx.restore(); ctx.restore();
}

let CUR = 0, pending = Promise.resolve();
async function drawAt(t) {
  const s = segAt(t), u = t - s.t;
  if (s.clip === 'INSERT') phone(u);
  else {
    const img = await loadImg(frameSrc(s.clip, s.a + u));
    if (img) cover(img);
    const fi = Math.floor((s.a + u) * SK3.fps_src) + 1;
    if (img && s.clip === 'p4' && fi <= 64) {           // Veo wrote « 9:16 » on the salon's sign: blurred while it is in view
      const q = Math.min(1, (fi - 1) / 39), q2 = lin(fi, 40, 64), k = 1.5;
      const x0 = 40 * (1 - q), y0 = 28 * (1 - q), x1 = 150 - 50 * q - 30 * q2, y1 = 195 - 70 * q - 40 * q2;
      const o = document.createElement('canvas'); o.width = W; o.height = H; const c = o.getContext('2d');
      c.filter = 'blur(14px)'; c.drawImage(img, 0, 0, W, H);
      ctx.save(); rrect(ctx, x0 * k, y0 * k, (x1 - x0) * k, (y1 - y0) * k, 14); ctx.clip(); ctx.drawImage(o, 0, 0); ctx.restore();
    }
  }
  const ek = eo(lin(t, EV.end, EV.end + .45));
  Object.assign(document.getElementById('endc').style, { opacity: ek, transform: `scale(${1.04 - .04 * ek})` });
  const sb = SK3.subs.find(x => t >= x.t0 && t < x.t1), el = document.getElementById('sub');
  el.textContent = sb && t < EV.end ? sb.text : '';
  if (sb) el.style.transform = `skewX(-7deg) scale(${.85 + .15 * back(lin(t, sb.t0, sb.t0 + .16))})`;
}
window.renderAt = t => { CUR = t; pending = drawAt(t); };
window.waitFrame = () => pending.then(() => new Promise(r => requestAnimationFrame(() => r())));
// sounds for the mix (src/sk3_audio.py)
window.SFX = [[EV.silence, 'sting'], [EV.insert + .45, 'pop'], [EV.insert + 1.85, 'tap'], [EV.end, 'end']];
window.ready = (async () => {
  const scr = await Promise.all(Array.from({ length: NSCR }, (_, i) => loadImg(`assets/sketch3/scr/s${String(i).padStart(3, '0')}.jpg`)));
  scr.forEach((im, i) => SCR[i] = im);
  const bg = await loadImg(frameSrc('p6', 4.9));
  BLUR = document.createElement('canvas'); BLUR.width = W; BLUR.height = H; const b = BLUR.getContext('2d');
  b.filter = 'blur(18px) brightness(.62)'; b.drawImage(bg, -60, -100, W + 120, H + 200);
  await document.fonts.ready; await drawAt(0);
})();
</script>
</body>
</html>
