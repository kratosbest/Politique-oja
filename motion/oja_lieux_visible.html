/* ============================================================
   OJA Transport — 65 s motion piece, driven by renderAt(t).
   Every frame is a pure function of time => deterministic render.
   ============================================================ */
const DUR = 52.0;
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: x => x,
  oC: x => 1 - Math.pow(1 - x, 3),
  iC: x => x * x * x,
  ioC: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  oQ: x => 1 - Math.pow(1 - x, 4),
  oE: x => x === 1 ? 1 : 1 - Math.pow(2, -10 * x),
  iE: x => x === 0 ? 0 : Math.pow(2, 10 * x - 10),
  ioE: x => x === 0 ? 0 : x === 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2,
  oB: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  oB2: x => { const c1 = 2.8, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  oEl: x => x === 0 ? 0 : x === 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI) / 3) + 1,
  oBo: x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; },
};
const P = (t, a, d, e = E.oC) => e(clamp((t - a) / d));
// keyframe interpolation: [[t,v],...]
function KF(t, kf, e = E.ioC) {
  if (t <= kf[0][0]) return kf[0][1];
  for (let i = 1; i < kf.length; i++) if (t <= kf[i][0]) { const [t0, v0] = kf[i - 1], [t1, v1] = kf[i]; return lerp(v0, v1, e((t - t0) / (t1 - t0))); }

}
const cache = {};
const el = id => (typeof id === 'string' ? (cache[id] || (cache[id] = $(id))) : id);
function T(id, o) {
  const e = el(id); if (!e) return;
  const { x = 0, y = 0, s = 1, sx = s, sy = s, r = 0, rx = 0, ry = 0, sk = 0 } = o;
  e.style.transform = `perspective(1800px) translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotate(${r}deg) skewX(${sk}deg) scale(${sx},${sy})`;
  if (o.o !== undefined) { e.style.opacity = o.o; e.style.visibility = o.o <= .001 ? 'hidden' : 'visible'; }
}
const O = (id, o) => { const e = el(id); e.style.opacity = o; e.style.visibility = o <= .001 ? 'hidden' : 'visible'; };

/* ---------- text builders ---------- */
// "*word*" => highlighted word
function W(str, hl = 'hl') {

}
function L(str, hl = '') { return [...str].map(ch => `<span class="wm"><span class="wi ${hl}">${ch === ' ' ? '&nbsp;' : ch}</span></span>`).join(''); }
function wordsIn(id, t, t0, st = .08, dur = .55, ease = E.oE, exitAt = null, exitDur = .4, from = 115) {
  const ws = el(id).querySelectorAll('.wi');
  ws.forEach((w, i) => {

function finale(t) {
  const on = t >= V('endA') - .3, e = el('fin'); e.style.visibility = on ? 'visible' : 'hidden'; if (!on) return;
  // her smiling photo is drawn by heroine() under the glows; the texts come on the free side
  const lp = P(t, V('endA') - .2, .6, E.oB); el('fl').style.transform = `scale(${lerp(.5, 1, lp)})`; el('fl').style.opacity = clamp(lp * 1.5);
  el('fw').style.clipPath = `inset(-20% ${100 - P(t, V('endA'), .5, E.oQ) * 100}% -20% 0)`;
  const sp = P(t, V('endB'), .7, E.oQ); el('fs').style.opacity = sp; el('fs').style.transform = `translateY(${(1 - sp) * 30}px)`; el('fs').style.filter = `blur(${(1 - sp) * 12}px)`;
  const st = P(t, V('endB') + 1.7, .6, E.oQ); el('fst').style.opacity = st; el('fst').style.transform = `translateY(${(1 - st) * 30}px)`;
  el('fm').style.opacity = P(t, V('endB') + 2.1, .6) * .9;
}

/* ---------- master ---------- */
window.renderAt = function (t) {
  atmosphere(t); clock(t); call(t);
  // A: the day
  say('L0', t, V('t0') + .9, V('von') - .1); say('L1', t, V('von'), V('onze') - .15);
  lostMap(t); say('L2', t, V('expl'), V('perd') - .1); say('L3', t, V('perd'), V('quatorze') - .15);
  say('L4', t, V('vide'), V('tuesla') - .1); say('L5', t, V('tuesla'), V('msg') - .15);
  say('L6', t, V('msg'), V('siAt') - .15); notif(t);
  say('L7', t, V('siAt'), V('ajoute') - .15); bigPin(t);
  // B: OJA
  el('bug').style.opacity = P(t, V('ajoute'), .6) * (1 - P(t, V('endA') - .5, .4));
  form(t); say('L8', t, V('ajoute'), V('mots') - .15);
  search(t); say('L9', t, V('mots'), V('publics') - .15);
  community(t); say('L10', t, V('publics'), V('tous') - .1); say('L11', t, V('tous'), V('deux') - .15);
  validate(t); say('L12', t, V('deux'), V('valide') - .1); say('L13', t, V('valide'), V('publie') - .1); say('L14', t, V('publie'), V('erreur') - .15);
  report(t); say('L15', t, V('erreur'), V('signale') - .1); say('L16', t, V('signale'), V('endA') - .15);
  finale(t);
  let fl = 0;
  for (const [a, d, m] of [[V('ajoute') - .2, .35, .7], [V('endA') - .35, .3, .3]]) fl = Math.max(fl, m * Math.sin(Math.PI * clamp((t - a) / d)));
  O('flash', fl);
  O('fade', Math.max(1 - P(t, 0, .4, E.lin), P(t, DUR2 - .6, .6, E.lin)));
};

/* readiness: fonts + images */
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  for (const im of PRE) if (!im.complete) await new Promise(r => { im.onload = im.onerror = r; });
  window.renderAt(0);
  return true;
})();
if (location.search.includes('play')) {
  const a = $('aud'); let t0 = null;
  const fit = () => { const s = Math.min(innerWidth / 1080, innerHeight / 1920); stage.style.transform = `scale(${s})`; stage.style.transformOrigin = '0 0'; };
  fit(); addEventListener('resize', fit);
  const loop = () => { const t = a && !a.paused ? a.currentTime : (t0 === null ? 0 : (performance.now() - t0) / 1000); window.renderAt(t % DUR); requestAnimationFrame(loop); };
  document.addEventListener('click', () => { a.currentTime = 0; a.play().catch(() => { t0 = performance.now(); }); });
  window.ready.then(loop);
}
