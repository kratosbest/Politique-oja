   Voix_mascotte_echantillon.mp3). The app screens are rebuilt from Derrick's screenshots of the version on the stores
   (IMG_1145 to IMG_1157), with fictitious Beninese data: « Chez Maman Rose », a drawn map of a Cotonou neighbourhood,
   +229 numbers masked. No real name, number, address or position on screen.

#sub .w{opacity:.28;transition:none}
#sub .w.on{opacity:1}

    return `<path d="${p}"/>`; }).join('');

/* ---------- a drawn street map (fictitious places) ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mapSVG(w, h, seed, o = {}) {
  const r = rng(seed), sk = o.skew ?? .12; let s = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block"><rect width="${w}" height="${h}" fill="#F2F0EC"/>`;
  const xs = [], ys = []; for (let x = -60; x < w + 60; x += 64 + r() * 26) xs.push(x); for (let y = -40; y < h + 40; y += 56 + r() * 22) ys.push(y);
  const P = (x, y) => `${(x + y * sk).toFixed(1)},${(y - x * sk * .5).toFixed(1)}`;
  s += `<g fill="#E8E4DD" stroke="#DED8CF" stroke-width=".8">`;
  for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
    const x0 = xs[i] + 8, x1 = xs[i + 1] - 8, y0 = ys[j] + 8, y1 = ys[j + 1] - 8, n = 1 + Math.floor(r() * 3);
    for (let k = 0; k < n; k++) { const bw = (x1 - x0) * (.3 + r() * .35), bh = (y1 - y0) * (.35 + r() * .4), bx = x0 + r() * (x1 - x0 - bw), by = y0 + r() * (y1 - y0 - bh);
      s += `<polygon points="${P(bx, by)} ${P(bx + bw, by)} ${P(bx + bw, by + bh)} ${P(bx, by + bh)}"/>`; }
  }
  s += `</g>`;
  if (o.park) s += `<path d="${o.park}" fill="#D5EBCB"/>`;
  if (o.water) s += `<path d="${o.water}" fill="#B6DAF2"/>`;
  const line = (pts, wd, c) => `<polyline points="${pts.map(([a, b]) => P(a, b)).join(' ')}" fill="none" stroke="${c}" stroke-width="${wd}" stroke-linecap="round"/>`;
  let g1 = '', g2 = '';
  for (const x of xs) { g1 += line([[x, -60], [x, h + 60]], 9, '#E2DCD2'); g2 += line([[x, -60], [x, h + 60]], 6, '#FFFFFF'); }
  for (const y of ys) { g1 += line([[-60, y], [w + 60, y]], 9, '#E2DCD2'); g2 += line([[-60, y], [w + 60, y]], 6, '#FFFFFF'); }
  s += g1 + g2;
  if (o.main) s += `<path d="${o.main}" fill="none" stroke="#E8CF8C" stroke-width="17"/><path d="${o.main}" fill="none" stroke="#FCE7A8" stroke-width="12"/>`;
  return s + `</svg>`;
