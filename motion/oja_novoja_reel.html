/* silk ribbon: a band along a Catmull-Rom curve, twisting (the visible width and the light follow the twist) */
function spline(P) {
  return s => {
    const n = P.length - 1, f = cl(s) * n, i = Math.min(n - 1, Math.floor(f)), u = f - i;

    return [c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])];

}

const C_DARK = [110, 36, 0], C_LIGHT = [255, 190, 120], C_BACK0 = [60, 18, 0], C_BACK1 = [200, 86, 16];

  if (s1 - s0 < .004) return;

  ctx.globalAlpha = alpha;
  for (let i = 0; i < N; i++) {
    const s = s0 + (s1 - s0) * (i + .5) / N, u = (i + .5) / N;
    const th = s * Math.PI * 3.2 + t * 2.1 + ph, c = Math.cos(th);
    const taper = Math.min(1, u / .07, (1 - u) / .07);
    const hw = width / 2 * (.16 + .84 * Math.abs(c)) * Math.sqrt(Math.max(0, taper));
    const a = pts[i], b = pts[i + 1], pa = pts[Math.max(0, i - 1)], pb = pts[Math.min(N, i + 2)];
    let nx = -(b[1] - pa[1]), ny = b[0] - pa[0], l = Math.hypot(nx, ny) || 1; nx /= l; ny /= l;
    let mx = -(pb[1] - a[1]), my = pb[0] - a[0], m = Math.hypot(mx, my) || 1; mx /= m; my /= m;
    const light = Math.pow(.5 + .5 * Math.cos(th - .9), 1.6);
    const col = c >= 0 ? mix(C_DARK, C_LIGHT, light) : mix(C_BACK0, C_BACK1, light * .8);

    ctx.beginPath(); ctx.moveTo(a[0] + nx * hw, a[1] + ny * hw); ctx.lineTo(b[0] + mx * hw, b[1] + my * hw);
    ctx.lineTo(b[0] - mx * hw, b[1] - my * hw); ctx.lineTo(a[0] - nx * hw, a[1] - ny * hw); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

// [front?, t0, t1, points, width, head [a,b], tail [a,b], phase]
const RIBBONS = [
  [1, 1.85, 2.62, [[-260, 1560], [120, 1300], [540, 1010], [930, 760], [1360, 420]], 170, [1.85, 2.3], [2.15, 2.62], 0],
  [0, 2.5, 4.6, [[1300, 640], [820, 760], [260, 960], [150, 1300], [520, 1560], [960, 1420], [1330, 1640]], 110, [2.5, 3.3], [3.95, 4.6], 1],
  [1, 4.15, 5.05, [[1320, 260], [760, 560], [280, 1080], [700, 1520], [-260, 1940]], 190, [4.15, 4.6], [4.5, 5.05], 2],
  [0, 4.9, 7.0, [[-240, 1840], [160, 1660], [820, 1720], [1140, 1480], [1320, 1300]], 90, [4.9, 5.7], [6.6, 7.0], 3],
  [0, 9.0, 11.0, ell(540, 1190, 470, 190, -.2, 2.6, 2.6 + 5.6), 84, [9.15, 10.0], [10.6, 11.0], 4],
  [1, 12.65, 13.35, [[-260, 300], [300, 700], [760, 1100], [400, 1600], [1340, 1900]], 190, [12.65, 13.05], [12.95, 13.35], 5],
  [0, 15.0, 16.2, ell(540, 960, 520, 520, 0, 0, 5.2, 18).map(([x, y], i, A) => { const k = i / (A.length - 1); return [540 + (x - 540) * (1 - k * .75), 960 + (y - 960) * (1 - k * .75)]; }), 120, [15.0, 15.5], [15.6, 16.2], 6],
  [1, 15.9, DUR, [[170, 1112], [400, 1132], [680, 1104], [930, 1074]], 30, [15.9, 16.6], [99, 99], 7],
];
function drawRibbons(t) {
  rB.clearRect(0, 0, W, H); rF.clearRect(0, 0, W, H);
  for (const [front, t0, t1, P, w, hd, tl, ph] of RIBBONS) {
    if (t < t0 || t >= t1) continue;
    const s1 = eo(lin(t, hd[0], hd[1])), s0 = eio(lin(t, tl[0], tl[1]));
    ribbon(front ? rF : rB, P, s0, s1, w, t, ph);
  }
}

/* sparks */
const BURSTS = [[.5, 540, 930, 120], [6.2, 820, 640, 60], [13.45, 540, 1100, 70], [14.05, 540, 1600, 60], [15.62, 540, 840, 140]];
const SPARK = BURSTS.map(([t0, x, y, n], k) => { const r = rng(100 + k); return Array.from({ length: n }, () => ({ a: r() * Math.PI * 2, v: 500 + r() * 1500, life: .45 + r() * .8, w: 2 + r() * 4, hue: r() })); });
function drawFx(t) {
  fx.clearRect(0, 0, W, H); fx.lineCap = 'round';
  BURSTS.forEach(([t0, ox, oy], k) => {
    const dt = t - t0; if (dt < 0 || dt > 1.4) return;
    for (const p of SPARK[k]) {
      if (dt > p.life) continue;
      const pos = d => { const r = p.v * (1 - Math.exp(-d * 3.2)) / 3.2; return [ox + Math.cos(p.a) * r, oy + Math.sin(p.a) * r + 260 * d * d]; };
      const [x1, y1] = pos(dt), [x0, y0] = pos(Math.max(0, dt - .035)), k2 = 1 - dt / p.life;
      fx.strokeStyle = p.hue < .55 ? `rgba(255,${150 + p.hue * 120 | 0},60,${k2})` : `rgba(255,240,215,${k2})`;
      fx.lineWidth = p.w * k2 + .5; fx.beginPath(); fx.moveTo(x0, y0); fx.lineTo(x1, y1); fx.stroke();
    }
  });
}

/* map for the route scene */
const ROUTE = [[170, 820], [300, 640], [470, 600], [560, 430], [740, 330], [830, 170]];
const mapCtx = $('s6c').getContext('2d');
function drawMap(p) {
  const c = mapCtx, r = rng(55);
  c.clearRect(0, 0, 1000, 1000);
  const g = c.createRadialGradient(500, 500, 100, 500, 500, 720); g.addColorStop(0, '#1B1E25'); g.addColorStop(1, '#0E1014');
  c.fillStyle = g; c.fillRect(0, 0, 1000, 1000);
  c.fillStyle = 'rgba(40,90,140,.35)'; c.beginPath(); c.moveTo(0, 930); c.bezierCurveTo(300, 860, 600, 990, 1000, 900); c.lineTo(1000, 1000); c.lineTo(0, 1000); c.fill();
  c.strokeStyle = '#262A33'; c.lineWidth = 6;
  for (let i = 0; i < 16; i++) { const y = 40 + i * 62 + r() * 20; c.beginPath(); c.moveTo(0, y); c.bezierCurveTo(330, y + r() * 60 - 30, 660, y + r() * 60 - 30, 1000, y + r() * 40 - 20); c.stroke(); }
  for (let i = 0; i < 16; i++) { const x = 30 + i * 64 + r() * 20; c.beginPath(); c.moveTo(x, 0); c.bezierCurveTo(x + r() * 60 - 30, 330, x + r() * 60 - 30, 660, x + r() * 40 - 20, 1000); c.stroke(); }
  c.strokeStyle = '#363B46'; c.lineWidth = 16;
  c.beginPath(); c.moveTo(0, 700); c.bezierCurveTo(300, 600, 650, 520, 1000, 260); c.stroke();
  c.beginPath(); c.moveTo(420, 0); c.bezierCurveTo(470, 300, 520, 650, 620, 1000); c.stroke();
  // route
  const f = spline(ROUTE), N = 120, k = Math.floor(N * p);
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const [w, col] of [[30, 'rgba(255,107,0,.25)'], [12, OR], [4, '#FFD2B0']]) {
    c.strokeStyle = col; c.lineWidth = w; c.beginPath();
    for (let i = 0; i <= k; i++) { const [x, y] = f(i / N); i ? c.lineTo(x, y) : c.moveTo(x, y); } c.stroke();
  }
  const pin = ([x, y], col, ring) => {
    if (ring > 0) { c.strokeStyle = `rgba(255,138,31,${1 - ring})`; c.lineWidth = 6; c.beginPath(); c.arc(x, y, 20 + ring * 90, 0, Math.PI * 2); c.stroke(); }
    c.fillStyle = col; c.beginPath(); c.arc(x, y, 24, 0, Math.PI * 2); c.fill(); c.fillStyle = '#fff'; c.beginPath(); c.arc(x, y, 9, 0, Math.PI * 2); c.fill();
  };
  pin(ROUTE[0], OR, 0);
  pin(ROUTE[ROUTE.length - 1], p >= 1 ? GR : '#5B6170', p >= 1 ? 0 : 0);
  return f(p);
}

/* ---------- per-frame ---------- */
const show = (id, t) => { const [a, b] = S[id]; const v = t >= a && t < b; $(id).style.visibility = v ? 'visible' : 'hidden'; return v; };
const exitK = (t, id, d = .3) => lin(t, S[id][1] - d, S[id][1]);
function pop(e, t, t0, d = .45, extra = '') { const p = lin(t, t0, t0 + d), k = bk(p); st(e, { opacity: cl(p * 2.2), transform: `scale(${.4 + .6 * k}) ${extra}` }); }

function renderAt(t) {
  drawBg(t); drawRibbons(t); drawFx(t);
  // S1: logo
  if (show('s1', t)) {
    const m = lin(t, .1, .6); st($('s1m'), { transform: `scale(${bk(m)}) rotate(${(1 - eo(m)) * -30}deg)`, opacity: cl(m * 3) });
    for (let i = 0; i < 6; i++) { const p = eo(lin(t, .32 + i * .07, .32 + i * .07 + .45)); st($('s1l' + i), { opacity: p, transform: `translateY(${(1 - p) * 70}px) scale(${1.45 - .45 * p})`, filter: `blur(${(1 - p) * 16}px)` }); }
    const tg = eo(lin(t, 1.0, 1.4)); st($('s1t'), { opacity: tg, transform: `translateY(${(1 - tg) * 30}px)` });
    const x = eio(exitK(t, 's1', .35)); st($('s1in'), { transform: `scale(${1 + x * .4 + t * .02})`, filter: `blur(${x * 18}px)`, opacity: 1 - x });
  }
  // S2: what sleeps at home
  if (show('s2', t)) {
    const a = eo(lin(t, 2.5, 3.1)), x = eio(exitK(t, 's2', .35)), d = t - 2.5;
    st($('s2a'), { opacity: a * (1 - x), transform: `translateY(${(1 - a) * 160 + Math.sin(d * 2.2) * 14}px) scale(${(.75 + .25 * a) * (1 + d * .035) * (1 + x * .3)}) rotate(${Math.sin(d * 1.6) * 1.6}deg)`, filter: `blur(${(1 - a) * 14 + x * 16}px) drop-shadow(0 60px 70px rgba(0,0,0,.6))` });
    const r = eo(lin(t, 2.8, 3.4));
    st($('s2r'), { opacity: r * (1 - x), transform: `translateY(${(1 - r) * 240 + Math.sin(d * 2.6 + 1) * 18}px) rotate(${-12 + Math.sin(d * 2) * 4}deg) scale(${1 + d * .05})`, filter: `blur(${2 + x * 14}px) drop-shadow(0 40px 50px rgba(0,0,0,.55))` });
  }
  // S3: publish
  if (show('s3', t)) {
    const a = eo(lin(t, 4.5, 5.15)), x = eio(exitK(t, 's3', .35));
    st($('s3c'), { opacity: cl(a * 2) * (1 - x), transform: `translateX(${x * 700}px) rotateY(${-55 * (1 - a) - 8 + Math.sin(t * 1.4) * 2 + x * 45}deg) rotateX(${6 - 4 * a}deg) scale(${.85 + .15 * a})` });
    const sh = lin(t, 5.05, 5.25); $('s3fl').style.opacity = sh > 0 && sh < 1 ? (1 - sh) * .9 : 0;
    $('s3img').style.opacity = t >= 5.05 ? 1 : 0; $('s3cam').style.opacity = t >= 5.05 ? 0 : 1;
    $('s3img').firstChild.style.transform = `scale(${1.08 - .08 * eo(lin(t, 5.05, 6.6))})`;
    for (const [id, t0] of [['s3tg', 5.3], ['s3f', 5.42], ['s3ch', 5.55], ['s3b', 5.7]]) { const p = eo(lin(t, t0, t0 + .3)); st($(id), { opacity: p, transform: `translateY(${(1 - p) * 26}px)` }); }
    const txt = 'Radio rétro', n = Math.floor(txt.length * lin(t, 5.5, 5.95)); $('s3ft').textContent = txt.slice(0, n);
    $('s3car').style.opacity = (Math.floor(t * 4) % 2 || t < 5.5) ? 1 : 0;
    const pr = lin(t, 6.05, 6.25); $('s3b').style.transform = `scale(${1 - .05 * Math.sin(pr * Math.PI)})`;
    pop($('s3ok'), t, 6.2, .45, `rotate(${-6 + 6 * eo(lin(t, 6.2, 6.6))}deg)`); if (x) $('s3ok').style.opacity *= 1 - x;
  }
  // S4: chat
  if (show('s4', t)) {
    const a = eo(lin(t, 7.0, 7.55)), x = eio(exitK(t, 's4', .3));
    st($('s4p'), { opacity: cl(a * 2) * (1 - x), transform: `translateY(${(1 - a) * 300}px) rotateY(${22 * (1 - a) - 8 + Math.sin(t * 1.2) * 2}deg) rotateX(${8 * (1 - a) + 4}deg) scale(${(.9 + .1 * a) * (1 - x * .15)})` });
    [7.4, 7.8, 8.2].forEach((t0, i) => { const e = $('s4b' + i); pop(e, t, t0, .42, `translateY(${Math.sin(t * 2 + i) * 6}px)`); e.style.transformOrigin = i === 1 ? '100% 100%' : '0 100%'; if (x) e.style.opacity *= 1 - x; });
  }
  // S5: the money waits
  if (show('s5', t)) {
    const a = lin(t, 9.0, 9.5), x = eio(exitK(t, 's5', .3));
    const drop = a < 1 ? -700 * Math.pow(1 - eo(a), 2) : 0, bounce = Math.sin(lin(t, 9.35, 9.7) * Math.PI) * -26;
    st($('s5c'), { opacity: cl(a * 3) * (1 - x), transform: `translateY(${drop + bounce + Math.sin(t * 2) * 8}px) rotate(${Math.sin(t * 1.5) * 3}deg) scale(${1 - x * .4})` });
    const v = eo(lin(t, 9.75, 10.2)); st($('s5v'), { opacity: v * (1 - x), transform: `rotate(${t * 18}deg) scale(${.7 + .3 * v})` });
    pop($('s5k'), t, 10.1, .45); if (x) $('s5k').style.opacity *= 1 - x;
  }
  // S6: on the way
  if (show('s6', t)) {
    const a = eo(lin(t, 11.0, 11.5)), x = eio(exitK(t, 's6', .3)), p = eio(lin(t, 11.35, 12.6));
    const [px, py] = drawMap(p);
    st($('s6m'), { opacity: cl(a * 2) * (1 - x), transform: `translateY(${(1 - a) * 260}px) rotateX(${54 + (1 - a) * 12}deg) rotateZ(${-16 + t * 2 - 22}deg) scale(${.92 + .08 * a + (t - 11) * .02})` });
    const hop = Math.abs(Math.sin(t * 9)) * 10;
    st($('s6k'), { transform: `translate(${px - 85}px,${py - 150}px) translateZ(${40 + hop}px) rotateZ(${16 - t * 2 + 22}deg) rotateX(-54deg)` });
    const s = eo(lin(t, 11.35, 11.75)); st($('s6s'), { opacity: s * (1 - x), transform: `translateY(${(1 - s) * 20}px)` });
    pop($('s6l'), t, 11.6, .45); if (x) $('s6l').style.opacity *= 1 - x;
  }
  // S7: received, seller paid
  if (show('s7', t)) {
    const a = eo(lin(t, 13.0, 13.45)), x = eio(exitK(t, 's7', .3)), j = Math.sin(lin(t, 13.4, 13.65) * Math.PI) * -30;
    st($('s7c'), { opacity: a * (1 - x), transform: `translateY(${(1 - a) * 120 + j}px) scale(${.8 + .2 * a}) rotate(${Math.sin(t * 1.4) * 2}deg)` });
    pop($('s7r'), t, 13.45, .4); if (x) $('s7r').style.opacity *= 1 - x;
    const n = eo(lin(t, 14.05, 14.45)); st($('s7n'), { opacity: n * (1 - x), transform: `translateY(${(1 - n) * 120}px) scale(${.94 + .06 * n})` });
  }
  // S8: collage into the logo
  if (show('s8', t)) {
    TILES.forEach((_, i) => {
      const p = eio(lin(t, 15.0, 15.75)), ang = i / TILES.length * Math.PI * 2 + p * 2.6, rad = 620 * (1 - p) + 40;
      const e = $('s8t' + i); st(e, { left: (540 - 150 + Math.cos(ang) * rad) + 'px', top: (900 - 150 + Math.sin(ang) * rad * 1.15) + 'px', opacity: 1 - eo(lin(t, 15.45, 15.8)), transform: `rotate(${(i % 2 ? 1 : -1) * (14 - 14 * p) + p * 30}deg) scale(${1 - .7 * p})` });
    });
    const m = lin(t, 15.55, 15.95); st($('s8m'), { transform: `scale(${bk(m)})`, opacity: cl(m * 3) });
    for (let i = 0; i < 6; i++) { const p = eo(lin(t, 15.62 + i * .05, 15.62 + i * .05 + .4)); st($('s8l' + i), { opacity: p, transform: `translateY(${(1 - p) * 60}px) scale(${1.4 - .4 * p})`, filter: `blur(${(1 - p) * 14}px)` }); }
    for (const [id, t0] of [['s8g', 15.95], ['s8a', 16.35], ['s8s', 16.55], ['s8f', 16.75]]) { const p = eo(lin(t, t0, t0 + .4)); st($(id), { opacity: p, transform: `translateY(${(1 - p) * 26}px)` }); }
    st($('s8in'), { transform: `scale(${1 + (t - 15) * .012})` });
  }
  // captions
  CAPS.forEach(([sc, , lines], k) => {
    const [a, b] = S[sc], v = t >= a && t < b, e = $('cap' + k); e.style.visibility = v ? 'visible' : 'hidden'; if (!v) return;
    const x = eio(lin(t, b - .28, b));
    lines.forEach((ln, j) => ln.forEach(([, , t0], i) => { const p = eo(lin(t, t0, t0 + .38)); st($(`cw${k}_${j}_${i}`), { opacity: p * (1 - x), transform: `translateY(${(1 - p) * 60 - x * 50}px)`, filter: `blur(${(1 - p) * 12 + x * 8}px)` }); }));
  });
}
window.waitFrame = () => Promise.all([...document.images].filter(i => !i.complete).map(i => i.decode().catch(() => 0)));
window.ready = (async () => { await document.fonts.load('900 100px Poppins'); await document.fonts.load('800 40px Inter'); await document.fonts.ready; await Promise.all([...document.images].map(i => i.decode().catch(() => 0))); renderAt(0); })();
if (location.search.includes('play')) { const t0 = performance.now(); const loop = () => { renderAt(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; window.ready.then(loop); }
</script>
